<!DOCTYPE html>

<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BYbuyerstore莫莫店</title>

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#222222">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="莫莫闲鱼铺">
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: 8px;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin: 3px 0 8px;
      font-size: 21px;
      font-weight: 700;
    }

    .info-card {
      background: #fff;
      border-radius: 10px;
      padding: 18px 14px;
      margin-bottom: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .operation-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .operation-title {
      font-size: 16px;
      font-weight: 600;
    }

    .operation-selector {
      position: relative;
      flex-shrink: 0;
    }

    .operation-button {
      width: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 7px 12px;
      margin: 0;
      border-radius: 16px;
      background: #222;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      line-height: 1;
      box-shadow: 0 2px 5px rgba(0,0,0,0.12);
    }

    .operation-arrow {
      font-size: 11px;
      opacity: 0.85;
      transition: transform 0.15s ease;
    }

    .operation-button.open .operation-arrow {
      transform: rotate(180deg);
    }

    .operation-menu {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      min-width: 110px;
      padding: 5px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.16);
      z-index: 1000;
    }

    .operation-option {
      width: 100%;
      padding: 9px 12px;
      margin: 0;
      background: transparent;
      color: #333;
      text-align: center;
      font-size: 14px;
      border-radius: 7px;
    }

    .operation-option:hover {
      background: #f2f2f2;
    }

    .operation-option.selected {
      background: #222;
      color: #fff;
    }

    .operation-menu.hidden {
      display: none !important;
    }

    .info-row {
      display: flex;
      align-items: center;
      min-height: 40px;
      margin-bottom: 12px;
    }

    .info-row:last-child {
      margin-bottom: 0;
    }

    .info-label {
      width: 52px;
      flex-shrink: 0;
      font-size: 13px;
      color: #888;
    }

    .info-value {
      flex: 1;
      font-size: 18px;
      font-weight: 600;
      word-break: break-all;
    }

    .quantity-card {
      background: #fff;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .quantity-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .quantity-label {
      width: 64px;
      flex-shrink: 0;
      font-size: 13px;
      color: #666;
    }

    input {
      flex: 1;
      width: 100%;
      padding: 9px 10px;
      font-size: 17px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
      min-width: 0;
    }

    input:focus {
      border-color: #888;
    }

    /* 数量默认值 1 */
    #quantityInput.quantity-default {
      color: #aaa;
    }

    #quantityInput.quantity-active {
      color: #222;
    }

    .scan-card {
      background: #fff;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .step {
      font-weight: 600;
      font-size: 15px;
      margin-bottom: 6px;
    }

    #reader {
      width: 100%;
      height: 260px;
      margin-top: 4px;
      overflow: hidden;
      border-radius: 8px;
    }

    #reader video {
      width: 100% !important;
      height: 260px !important;
      object-fit: cover !important;
      border-radius: 8px;
    }

    #reader__dashboard {
      margin-top: 3px !important;
    }

    .scan-status {
      text-align: center;
      margin: 5px 0;
      color: #666;
      font-size: 12px;
    }

    .result-box {
      background: #f7f7f7;
      border-radius: 8px;
      padding: 8px;
      margin-top: 6px;
      text-align: center;
    }

    .result-label {
      font-size: 11px;
      color: #666;
      margin-bottom: 2px;
    }

    .result-value {
      font-size: 23px;
      font-weight: 700;
      word-break: break-all;
    }

    .manual-area {
      margin-top: 6px;
      text-align: center;
    }

    .manual-toggle {
      width: auto;
      display: inline-block;
      padding: 5px 9px;
      margin: 0;
      background: transparent;
      color: #777;
      font-size: 12px;
    }

    .manual-box {
      background: #f7f7f7;
      border-radius: 8px;
      padding: 9px;
      margin-top: 6px;
    }

    .manual-title {
      font-size: 12px;
      color: #666;
      margin-bottom: 6px;
    }

    .manual-row {
      display: flex;
      gap: 6px;
    }

    .manual-input {
      flex: 1;
      min-width: 0;
      padding: 8px 9px;
      font-size: 17px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
    }

    .manual-confirm {
      width: auto;
      flex-shrink: 0;
      padding: 8px 12px;
      margin: 0;
      background: #222;
      color: #fff;
      border-radius: 8px;
      font-size: 14px;
    }

    .manual-cancel {
      width: auto;
      padding: 4px 8px;
      margin: 5px 0 0;
      background: transparent;
      color: #888;
      font-size: 11px;
    }

    .action-card {
      background: #fff;
      border-radius: 10px;
      padding: 9px 10px;
      margin-bottom: 5px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    button {
      width: 100%;
      padding: 9px;
      margin-top: 5px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.55;
    }

    .primary {
      background: #222;
      color: #fff;
    }

    .secondary {
      background: #e8e8e8;
      color: #222;
    }

    .bottom-tools {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 2px;
      margin-bottom: 2px;
    }

    .small-button {
      width: auto;
      padding: 4px 8px;
      margin: 0;
      background: transparent;
      color: #888;
      font-size: 11px;
    }

    .small-button:active {
      background: #e8e8e8;
      border-radius: 5px;
    }

    .success {
      background: #e8f7e8;
      color: #176b17;
      padding: 8px;
      border-radius: 8px;
      margin-top: 6px;
      display: none;
      word-break: break-all;
      font-size: 13px;
    }

    .error {
      background: #fdeaea;
      color: #a00000;
      padding: 8px;
      border-radius: 8px;
      margin-top: 6px;
      display: none;
      word-break: break-all;
      font-size: 13px;
    }

    .hidden {
      display: none !important;
    }

    @media (max-height: 700px) {

      body {
        padding: 6px;
      }

      h1 {
        margin: 2px 0 6px;
        font-size: 20px;
      }

      .info-card {
        padding: 14px 11px;
        margin-bottom: 6px;
      }

      .operation-line {
        margin-bottom: 14px;
      }

      .info-row {
        min-height: 36px;
        margin-bottom: 9px;
      }

      .info-value {
        font-size: 17px;
      }

      .quantity-card {
        padding: 8px;
        margin-bottom: 6px;
      }

      .scan-card {
        padding: 8px;
        margin-bottom: 6px;
      }

      #reader {
        height: 240px;
      }

      #reader video {
        height: 240px !important;
      }

      .scan-status {
        margin: 4px 0;
      }

      .action-card {
        padding: 7px 8px;
      }

      button {
        padding: 8px;
        margin-top: 4px;
      }

    }

  </style>

</head>

<body>

<div class="container">

  <h1>BYbuyerstore莫莫店</h1>

  <div class="info-card">


<div class="operation-line">

  <div class="operation-title">
    库存操作
  </div>

  <div class="operation-selector">

    <button
      id="operationButton"
      class="operation-button"
      onclick="toggleOperationMenu()">

      <span id="operationTag">
        入库
      </span>

      <span class="operation-arrow">
        ▼
      </span>

    </button>

    <div
      id="operationMenu"
      class="operation-menu hidden">

      <button
        class="operation-option selected"
        data-operation="入库"
        onclick="selectOperation('入库')">
        入库
      </button>

      <button
        class="operation-option"
        data-operation="移库"
        onclick="selectOperation('移库')">
        移库
      </button>

      <button
        class="operation-option"
        data-operation="出库"
        onclick="selectOperation('出库')">
        出库
      </button>

    </div>

  </div>

</div>

<div class="info-row">

  <div class="info-label">
    商品
  </div>

  <div
    id="serialDisplay"
    class="info-value">
    等待扫描
  </div>

</div>

<div class="info-row">

  <div class="info-label">
    仓位
  </div>

  <div
    id="locationDisplay"
    class="info-value">
    等待扫描
  </div>

</div>


  </div>

  <div id="manualBoxTarget"></div>

  <div class="quantity-card">


<div class="quantity-row">

  <div
    id="quantityLabel"
    class="quantity-label">
    入库数量
  </div>

  <input
    id="quantityInput"
    type="number"
    min="1"
    step="1"
    value="1"
    class="quantity-default"
    inputmode="numeric">

</div>


  </div>

  <div class="scan-card">


<div
  id="stepTitle"
  class="step">
  第一步：扫描商品条码
</div>

<div id="reader"></div>

<div
  id="scanStatus"
  class="scan-status">
  正在准备摄像头……
</div>

<div
  id="resultBox"
  class="result-box hidden">

  <div class="result-label">
    扫描结果
  </div>

  <div
    id="resultValue"
    class="result-value">
  </div>

  <button
    id="confirmButton"
    class="primary"
    onclick="confirmScan()">
    确认
  </button>

  <button

  </button>

<div class="manual-area">

  <button
    id="manualToggleButton"

    无法扫码？手动输入
  </button>

</div>


  </div>

  <div class="action-card">


<button
  id="stockInButton"
  class="primary"
  onclick="executeStockIn()">
  执行入库
</button>

<button
  class="secondary"
  onclick="resetAll()">
  重新开始
</button>

<div
  id="successMessage"
  class="success">
</div>

<div
  id="errorMessage"
  class="error">
</div>


  </div>

  <div class="bottom-tools">

```
<button
  class="small-button"
  onclick="testConnection()">
  测试连接
</button>
```

  </div>

</div>

<div
  id="manualBox"
  class="manual-box hidden">

  <div
    id="manualTitle"
    class="manual-title">
    手动输入商品序号
  </div>

  <div class="manual-row">


<input
  id="manualInput"
  class="manual-input"
  type="text"
  autocomplete="off"
  autocapitalize="characters"
  spellcheck="false"
  placeholder="请输入商品序号">

<button
  class="manual-confirm"
  onclick="confirmManualInput()">
  确认
</button>


  </div>

<button
 class="manual-cancel"
 onclick="hideManualInput()">
取消手动输入 </button>

</div>

<script>

  // ==========================================
  // Apps Script
  // ==========================================

  const APPS_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbykJPjh3aCJrypFpdMa_SmKA6fw2hbfZu-K5V1BRk0dZHEL6hPm_X6ICibQPnPUMvF-/exec";


  // ==========================================
  // 当前库存操作类型
  // ==========================================

  let currentOperation = "入库";


  // ==========================================
  // 数量输入
  // ==========================================

  const quantityInput =
    document.getElementById("quantityInput");


  function setQuantityDefault() {

    quantityInput.value = "1";

    quantityInput.classList.remove(
      "quantity-active"
    );

    quantityInput.classList.add(
      "quantity-default"
    );

  }


  function activateQuantityInput() {

    if (
      quantityInput.classList.contains(
        "quantity-default"
      )
    ) {

      quantityInput.value = "";

      quantityInput.classList.remove(
        "quantity-default"
      );

      quantityInput.classList.add(
        "quantity-active"
      );

    }

  }


  quantityInput.addEventListener(
    "focus",
    function() {

      activateQuantityInput();

    }
  );


  quantityInput.addEventListener(
    "input",
    function() {

      quantityInput.classList.remove(
        "quantity-default"
      );

      quantityInput.classList.add(
        "quantity-active"
      );

    }
  );


  // ==========================================
  // 操作类型菜单
  // ==========================================

  function toggleOperationMenu() {

    const menu =
      document.getElementById(
        "operationMenu"
      );

    const button =
      document.getElementById(
        "operationButton"
      );

    menu.classList.toggle("hidden");

    button.classList.toggle("open");

  }


  function selectOperation(operation) {

    const changed =
      currentOperation !== operation;

    currentOperation =
      operation;

    document.getElementById(
      "operationTag"
    ).innerText =
      operation;

    const options =
      document.querySelectorAll(
        ".operation-option"
      );

    options.forEach(
      function(option) {

        if (
          option.dataset.operation ===
          operation
        ) {

          option.classList.add(
            "selected"
          );

        } else {

          option.classList.remove(
            "selected"
          );

        }

      }
    );

    document.getElementById(
      "operationMenu"
    ).classList.add("hidden");

    document.getElementById(
      "operationButton"
    ).classList.remove("open");


    if (changed) {

      resetOperationData();

    }

    updateOperationUI();

  }


  // ==========================================
  // 根据操作类型更新界面
  // ==========================================

  function updateOperationUI() {

    const button =
      document.getElementById(
        "stockInButton"
      );

    const quantityLabel =
      document.getElementById(
        "quantityLabel"
      );


    if (currentOperation === "入库") {

      button.disabled = false;

      button.innerText =
        "执行入库";

      quantityLabel.innerText =
        "入库数量";

      updateStatus();

      return;

    }


    if (currentOperation === "移库") {

      button.disabled = false;

      button.innerText =
        "执行移库";

      quantityLabel.innerText =
        "移库数量";

      updateStatus();

      return;

    }


    if (currentOperation === "出库") {

      button.disabled = false;

      button.innerText =
        "执行出库";

      quantityLabel.innerText =
        "出库数量";

      updateStatus();

      return;

    }

  }


  // ==========================================
  // 点击页面其他位置时，
  // 自动关闭操作选择菜单。
  // ==========================================

  document.addEventListener(
    "click",
    function(event) {

      const selector =
        document.querySelector(
          ".operation-selector"
        );

      if (
        selector &&
        !selector.contains(event.target)
      ) {

        document.getElementById(
          "operationMenu"
        ).classList.add("hidden");

        document.getElementById(
          "operationButton"
        ).classList.remove("open");

      }

    }
  );


  // ==========================================
  // 扫码提示音
  // ==========================================

  let audioContext = null;


  function initAudio() {

    if (!audioContext) {

      const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

      if (!AudioContext) {
        return;
      }

      audioContext =
        new AudioContext();

    }

    if (
      audioContext.state === "suspended"
    ) {

      audioContext.resume().catch(
        function() {}
      );

    }

  }


  function unlockAudio() {

    initAudio();

  }


  function playScanBeep() {

    try {

      initAudio();

      if (!audioContext) {
        return;
      }

      if (
        audioContext.state === "suspended"
      ) {

        audioContext.resume().then(
          function() {
            createScanBeep();
          }
        ).catch(
          function() {}
        );

        return;

      }

      createScanBeep();

    } catch (error) {

    }

  }


  function createScanBeep() {

    try {

      const oscillator =
        audioContext.createOscillator();

      const gainNode =
        audioContext.createGain();

      oscillator.type = "sine";

      oscillator.frequency.setValueAtTime(
        880,
        audioContext.currentTime
      );

      gainNode.gain.setValueAtTime(
        0.0001,
        audioContext.currentTime
      );

      gainNode.gain.exponentialRampToValueAtTime(
        0.18,
        audioContext.currentTime + 0.01
      );

      gainNode.gain.exponentialRampToValueAtTime(
        0.0001,
        audioContext.currentTime + 0.12
      );

      oscillator.connect(gainNode);

      gainNode.connect(
        audioContext.destination
      );

      oscillator.start();

      oscillator.stop(
        audioContext.currentTime + 0.13
      );

    } catch (error) {

    }

  }


  document.addEventListener(
    "touchstart",
    unlockAudio,
    {
      passive: true
    }
  );


  document.addEventListener(
    "click",
    unlockAudio,
    {
      passive: true
    }
  );


  // ==========================================
  // 扫描状态
  // ==========================================

  let scanner = null;

  let step = "serial";

  let pendingResult = "";

  let serial = "";

  let oldLocation = "";

  let newLocation = "";

  let stockLocation = "";


  // ==========================================
  // 手动输入框原始位置
  // ==========================================

  let manualBoxOriginalParent = null;


  window.addEventListener(
    "load",
    function() {

      manualBoxOriginalParent =
        document.querySelector(
          ".manual-area"
        );

      setQuantityDefault();

      updateOperationUI();

      startScanner();

    }
  );


  // ==========================================
  // 启动摄像头
  // ==========================================

  // ==========================================
// 启动摄像头
// ==========================================

async function startScanner() {

  scanner =
    new Html5Qrcode("reader");



  const config = {

    fps: 15,

    qrbox: function(
      viewfinderWidth,
      viewfinderHeight
    ) {

      return {

        width: Math.min(
          Math.floor(
            viewfinderWidth * 0.36
          ),
          160
        ),

        height: Math.min(
          Math.floor(
            viewfinderHeight * 0.275
          ),
          110
        )

      };

    },

    formatsToSupport: [

      Html5QrcodeSupportedFormats.CODE_128,

      Html5QrcodeSupportedFormats.CODE_39,

      Html5QrcodeSupportedFormats.EAN_13,

      Html5QrcodeSupportedFormats.EAN_8,

      Html5QrcodeSupportedFormats.UPC_A,

      Html5QrcodeSupportedFormats.UPC_E

    ]

  };



  try {

    await scanner.start(

      {
        facingMode: "environment"
      },

      config,

      onScanSuccess,

      onScanFailure

    );



    // ==========================================
    // 尝试开启连续自动对焦
    // ==========================================

    try {

      const video =
        document.querySelector(
          "#reader video"
        );



      if (video && video.srcObject) {

        const tracks =
          video.srcObject.getVideoTracks();



        if (
          tracks &&
          tracks.length > 0
        ) {

          const track =
            tracks[0];



          // 获取当前摄像头支持的能力
          const capabilities =
            track.getCapabilities
              ? track.getCapabilities()
              : {};



          // 如果设备支持 focusMode，
          // 优先使用连续自动对焦
          if (
            capabilities.focusMode &&
            capabilities.focusMode.includes(
              "continuous"
            )
          ) {

            await track.applyConstraints({

              advanced: [

                {
                  focusMode:
                    "continuous"
                }

              ]

            });

          }

        }

      }

    }

    catch (focusError) {

      // 部分 iPhone / Safari 不允许网页控制对焦
      // 对焦设置失败时继续正常扫码
      console.log(
        "连续自动对焦设置未生效：",
        focusError
      );

    }



    updateStatus();

  }

  catch (error) {

    document.getElementById(
      "scanStatus"
    ).innerText =
      "无法启动摄像头：" + error;

  }

}


  // ==========================================
  // 扫描成功
  // ==========================================

  function onScanSuccess(decodedText) {

    if (
      step !== "serial" &&
      step !== "oldLocation" &&
      step !== "location"
    ) {

      return;

    }


    playScanBeep();


    pendingResult =
      String(decodedText).trim();


    document.getElementById(
      "resultValue"
    ).innerText =
      pendingResult;


    document.getElementById(
      "resultBox"
    ).classList.remove("hidden");


    hideManualInput();


    if (step === "serial") {

      document.getElementById(
        "confirmButton"
      ).innerText =
        "确认商品序号";

    }

    else if (step === "oldLocation") {

      document.getElementById(
        "confirmButton"
      ).innerText =
        "确认原仓位";

    }

    else {

      document.getElementById(
        "confirmButton"
      ).innerText =
        "确认仓存位置";

    }


    updateStatus();

  }


  // ==========================================
  // 确认扫描结果
  // ==========================================

  function confirmScan() {

    if (!pendingResult) {

      return;

    }


    if (step === "serial") {

      serial =
        pendingResult;


      document.getElementById(
        "serialDisplay"
      ).innerText =
        serial;


      pendingResult = "";


      document.getElementById(
        "resultBox"
      ).classList.add("hidden");


      if (currentOperation === "移库") {

        step = "oldLocation";

      } else {

        step = "location";

      }


      updateManualInputText();

      updateStatus();

      return;

    }


    if (step === "oldLocation") {

      oldLocation =
        pendingResult;


      document.getElementById(
        "locationDisplay"
      ).innerText =
        oldLocation;


      pendingResult = "";


      document.getElementById(
        "resultBox"
      ).classList.add("hidden");


      step = "location";


      updateManualInputText();

      updateStatus();

      return;

    }


    if (step === "location") {

      newLocation =
        pendingResult;


      stockLocation =
        newLocation;


      if (currentOperation === "移库") {

        document.getElementById(
          "locationDisplay"
        ).innerText =
          oldLocation +
          " → " +
          newLocation;

      } else {

        document.getElementById(
          "locationDisplay"
        ).innerText =
          newLocation;

      }


      pendingResult = "";


      document.getElementById(
        "resultBox"
      ).classList.add("hidden");


      step = "ready";


      updateManualInputText();

      updateStatus();

      return;

    }

  }


  // ==========================================
  // 当前扫描结果不正确
  // ==========================================

  function retryScan() {

    pendingResult = "";


    document.getElementById(
      "resultBox"
    ).classList.add("hidden");


    updateStatus();

  }


  // ==========================================
  // 显示手动输入
  // ==========================================

  function showManualInput() {

    if (
      step !== "serial" &&
      step !== "oldLocation" &&
      step !== "location"
    ) {

      return;

    }


    const manualBox =
      document.getElementById(
        "manualBox"
      );


    const target =
      document.getElementById(
        "manualBoxTarget"
      );


    target.appendChild(
      manualBox
    );


    manualBox.classList.remove(
      "hidden"
    );


    document.getElementById(
      "manualToggleButton"
    ).classList.add("hidden");


    updateManualInputText();


    const input =
      document.getElementById(
        "manualInput"
      );


    input.value = "";


    setTimeout(
      function() {

        input.focus();

      },
      100
    );

  }


  // ==========================================
  // 隐藏手动输入
  // ==========================================

  function hideManualInput() {

    const manualBox =
      document.getElementById(
        "manualBox"
      );


    manualBox.classList.add(
      "hidden"
    );


    if (manualBoxOriginalParent) {

      manualBoxOriginalParent.appendChild(
        manualBox
      );

    }


    document.getElementById(
      "manualToggleButton"
    ).classList.remove("hidden");

  }


  // ==========================================
  // 更新手动输入文字
  // ==========================================

  function updateManualInputText() {

    const title =
      document.getElementById(
        "manualTitle"
      );


    const input =
      document.getElementById(
        "manualInput"
      );


    if (step === "serial") {

      title.innerText =
        "手动输入商品序号";

      input.placeholder =
        "请输入商品序号";

    }

    else if (
      step === "oldLocation"
    ) {

      title.innerText =
        "手动输入原仓存位置";

      input.placeholder =
        "请输入原仓存位置";

    }

    else if (
      step === "location"
    ) {

      if (currentOperation === "移库") {

        title.innerText =
          "手动输入新仓存位置";

        input.placeholder =
          "请输入新仓存位置";

      } else {

        title.innerText =
          "手动输入仓存位置";

        input.placeholder =
          "请输入仓存位置";

      }

    }

    else {

      title.innerText =
        "";

      input.placeholder =
        "";

    }

  }


  // ==========================================
  // 确认手动输入
  // ==========================================

  function confirmManualInput() {

    const input =
      document.getElementById(
        "manualInput"
      );


    const value =
      input.value.trim();


    if (!value) {

      input.focus();

      return;

    }


    pendingResult =
      value;


    if (step === "serial") {

      serial =
        pendingResult;


      document.getElementById(
        "serialDisplay"
      ).innerText =
        serial;


      pendingResult = "";


      if (currentOperation === "移库") {

        step = "oldLocation";

      } else {

        step = "location";

      }


      hideManualInput();

      hideKeyboard();

      updateManualInputText();

      updateStatus();

      return;

    }


    if (step === "oldLocation") {

      oldLocation =
        pendingResult;


      document.getElementById(
        "locationDisplay"
      ).innerText =
        oldLocation;


      pendingResult = "";


      step = "location";


      hideManualInput();

      hideKeyboard();

      updateManualInputText();

      updateStatus();

      return;

    }


    if (step === "location") {

      newLocation =
        pendingResult;


      stockLocation =
        newLocation;


      if (currentOperation === "移库") {

        document.getElementById(
          "locationDisplay"
        ).innerText =
          oldLocation +
          " → " +
          newLocation;

      } else {

        document.getElementById(
          "locationDisplay"
        ).innerText =
          newLocation;

      }


      pendingResult = "";


      step = "ready";


      hideManualInput();

      hideKeyboard();

      updateManualInputText();

      updateStatus();

      return;

    }

  }


  // ==========================================
  // 收起 iPhone 键盘
  // ==========================================

  function hideKeyboard() {

    const input =
      document.getElementById(
        "manualInput"
      );

    input.blur();

  }


  // ==========================================
  // 状态文字
  // ==========================================

  function updateStatus() {

    const title =
      document.getElementById(
        "stepTitle"
      );


    const status =
      document.getElementById(
        "scanStatus"
      );


    if (step === "serial") {

      title.innerText =
        "第一步：扫描商品条码";

      status.innerText =
        "请扫描商品条码";

      return;

    }


    if (
      step === "oldLocation"
    ) {

      title.innerText =
        "第二步：扫描原仓位";

      status.innerText =
        "商品序号已确认，请扫描原仓位条码";

      return;

    }


    if (
      step === "location" &&
      currentOperation !== "移库"
    ) {

      title.innerText =
        "第二步：扫描仓存位置";

      if (currentOperation === "出库") {

        status.innerText =
          "商品序号已确认，请扫描出库仓位条码";

      } else {

        status.innerText =
          "商品序号已确认，请扫描仓存位置条码";

      }

      return;

    }


    if (
      step === "location" &&
      currentOperation === "移库"
    ) {

      title.innerText =
        "第三步：扫描新仓位";

      status.innerText =
        "原仓位已确认，请扫描新的仓位条码";

      return;

    }


    if (step === "ready") {

      title.innerText =
        "扫码完成";

      if (currentOperation === "入库") {

        status.innerText =
          "商品和仓存位置已确认，请输入入库数量";

      }

      else if (
        currentOperation === "移库"
      ) {

        status.innerText =
          "商品、原仓位和新仓位已确认，请输入移库数量";

      }

      else if (
        currentOperation === "出库"
      ) {

        status.innerText =
          "商品和出库仓位已确认，请输入出库数量";

      }

      return;

    }

  }


  // ==========================================
  // 执行库存操作
  // ==========================================

  async function executeStockIn() {

    hideMessages();


    if (!serial) {

      showError(
        "请先扫描并确认商品序号"
      );

      return;

    }


    /*
      如果数量框仍然保持默认状态，
      就把它视为数量 1。
    */

    let quantity =
      document.getElementById(
        "quantityInput"
      ).value.trim();


    if (!quantity) {

      quantity = "1";

      setQuantityDefault();

    }


    if (
      Number(quantity) <= 0 ||
      !Number.isInteger(
        Number(quantity)
      )
    ) {

      if (currentOperation === "入库") {

        showError(
          "入库数量必须是大于 0 的整数"
        );

      }

      else if (
        currentOperation === "移库"
      ) {

        showError(
          "移库数量必须是大于 0 的整数"
        );

      }

      else {

        showError(
          "出库数量必须是大于 0 的整数"
        );

      }

      return;

    }


    if (currentOperation === "入库") {

      if (!newLocation) {

        showError(
          "请先扫描并确认仓存位置"
        );

        return;

      }

    }


    if (currentOperation === "移库") {

      if (!oldLocation) {

        showError(
          "请先扫描并确认原仓位"
        );

        return;

      }


      if (!newLocation) {

        showError(
          "请先扫描并确认新仓位"
        );

        return;

      }


      if (
        oldLocation === newLocation
      ) {

        showError(
          "原仓位和新仓位不能相同"
        );

        return;

      }

    }


    if (currentOperation === "出库") {

      if (!newLocation) {

        showError(
          "请先扫描并确认出库仓位"
        );

        return;

      }

    }


    const button =
      document.getElementById(
        "stockInButton"
      );


    button.disabled = true;


    if (currentOperation === "入库") {

      button.innerText =
        "正在执行入库……";

    }

    else if (
      currentOperation === "移库"
    ) {

      button.innerText =
        "正在执行移库……";

    }

    else {

      button.innerText =
        "正在执行出库……";

    }


    try {

      const response =
        await fetch(
          APPS_SCRIPT_URL,
          {

            method: "POST",

            headers: {

              "Content-Type":
                "text/plain;charset=utf-8"

            },

            body: JSON.stringify({

              action: "inventory",

              serial:
                serial,

              oldLocation:
                currentOperation === "移库"
                  ? oldLocation
                  : "",

              newLocation:
                newLocation,

              quantity:
                Number(quantity),

              operationType:
                currentOperation

            })

          }
        );


      const result =
        await response.json();


      if (result.success) {

        showSuccess(
          result.message ||
          (
            currentOperation +
            "成功"
          )
        );


        if (
          currentOperation === "入库"
        ) {

          button.innerText =
            "入库成功";

        }

        else if (
          currentOperation === "移库"
        ) {

          button.innerText =
            "移库成功";

        }

        else {

          button.innerText =
            "出库成功";

        }

      }

      else {

        showError(
          result.message ||
          (
            currentOperation +
            "失败"
          )
        );


        button.disabled = false;


        if (
          currentOperation === "入库"
        ) {

          button.innerText =
            "执行入库";

        }

        else if (
          currentOperation === "移库"
        ) {

          button.innerText =
            "执行移库";

        }

        else {

          button.innerText =
            "执行出库";

        }

      }

    }


    catch (error) {

      showError(
        "通信失败：" +
        error.message
      );


      button.disabled = false;


      if (
        currentOperation === "入库"
      ) {

        button.innerText =
          "执行入库";

      }

      else if (
        currentOperation === "移库"
      ) {

        button.innerText =
          "执行移库";

      }

      else {

        button.innerText =
          "执行出库";

      }

    }

  }


  // ==========================================
  // 切换操作时清空当前操作数据
  // ==========================================

  function resetOperationData() {

    serial = "";

    oldLocation = "";

    newLocation = "";

    stockLocation = "";

    pendingResult = "";

    step = "serial";


    document.getElementById(
      "serialDisplay"
    ).innerText =
      "等待扫描";


    document.getElementById(
      "locationDisplay"
    ).innerText =
      "等待扫描";


    setQuantityDefault();


    document.getElementById(
      "resultBox"
    ).classList.add("hidden");


    document.getElementById(
      "manualInput"
    ).value =
      "";


    hideManualInput();


    const button =
      document.getElementById(
        "stockInButton"
      );


    button.disabled = false;


    hideMessages();


    updateManualInputText();

    updateStatus();

  }


  // ==========================================
  // 测试连接
  // ==========================================

  async function testConnection() {

    hideMessages();


    try {

      const response =
        await fetch(
          APPS_SCRIPT_URL,
          {

            method: "POST",

            headers: {

              "Content-Type":
                "text/plain;charset=utf-8"

            },

            body: JSON.stringify({

              action: "test"

            })

          }
        );


      const result =
        await response.json();


      if (result.success) {

        showSuccess(
          "✓ " + result.message
        );

      } else {

        showError(
          result.message ||
          "连接失败"
        );

      }

    }

    catch (error) {

      showError(
        "通信失败：" +
        error.message
      );

    }

  }


  // ==========================================
  // 完全重新开始
  // ==========================================

  function resetAll() {

    serial = "";

    oldLocation = "";

    newLocation = "";

    stockLocation = "";

    pendingResult = "";

    step = "serial";

    currentOperation = "入库";


    document.getElementById(
      "serialDisplay"
    ).innerText =
      "等待扫描";


    document.getElementById(
      "locationDisplay"
    ).innerText =
      "等待扫描";


    setQuantityDefault();


    document.getElementById(
      "resultBox"
    ).classList.add("hidden");


    document.getElementById(
      "manualInput"
    ).value =
      "";


    hideManualInput();


    document.getElementById(
      "operationTag"
    ).innerText =
      "入库";


    document.querySelectorAll(
      ".operation-option"
    ).forEach(
      function(option) {

        if (
          option.dataset.operation ===
          "入库"
        ) {

          option.classList.add(
            "selected"
          );

        } else {

          option.classList.remove(
            "selected"
          );

        }

      }
    );


    document.getElementById(
      "operationMenu"
    ).classList.add("hidden");


    document.getElementById(
      "operationButton"
    ).classList.remove("open");


    const button =
      document.getElementById(
        "stockInButton"
      );


    button.disabled = false;

    button.innerText =
      "执行入库";


    hideMessages();


    updateManualInputText();

    updateStatus();

  }


  // ==========================================
  // 成功
  // ==========================================

  function showSuccess(message) {

    const element =
      document.getElementById(
        "successMessage"
      );


    element.innerText =
      message;


    element.style.display =
      "block";

  }


  // ==========================================
  // 错误
  // ==========================================

  function showError(message) {

    const element =
      document.getElementById(
        "errorMessage"
      );


    element.innerText =
      "❌ " + message;


    element.style.display =
      "block";

  }


  // ==========================================
  // 隐藏提示
  // ==========================================

  function hideMessages() {

    document.getElementById(
      "successMessage"
    ).style.display =
      "none";


    document.getElementById(
      "errorMessage"
    ).style.display =
      "none";

  }


  // ==========================================
  // 扫描失败
  // ==========================================

  function onScanFailure(error) {

    // 不显示连续扫描失败信息

  }

</script>
