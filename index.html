<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>闲鱼库存扫码</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin: 10px 0 20px;
      font-size: 24px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .step {
      font-weight: 600;
      font-size: 17px;
      margin-bottom: 12px;
    }

    .label {
      font-size: 14px;
      color: #666;
      margin-bottom: 6px;
    }

    .value {
      font-size: 20px;
      font-weight: 600;
      min-height: 28px;
      word-break: break-all;
    }

    .scan-result {
      margin-top: 12px;
      padding: 14px;
      background: #f7f7f7;
      border-radius: 8px;
      text-align: center;
    }

    .scan-result-title {
      font-size: 13px;
      color: #666;
      margin-bottom: 5px;
    }

    .scan-result-value {
      font-size: 26px;
      font-weight: 700;
      word-break: break-all;
    }

    #reader {
      width: 100%;
      margin-top: 10px;
    }

    .scan-status {
      text-align: center;
      margin: 12px 0;
      color: #666;
      font-size: 14px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      font-size: 18px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-top: 5px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.55;
      cursor: default;
    }

    .primary {
      background: #222;
      color: #fff;
    }

    .secondary {
      background: #e8e8e8;
      color: #222;
    }

    .confirm {
      background: #222;
      color: #fff;
    }

    .success {
      background: #e8f7e8;
      color: #176b17;
      padding: 12px;
      border-radius: 8px;
      margin-top: 12px;
      display: none;
      word-break: break-all;
    }

    .error {
      background: #fdeaea;
      color: #a00000;
      padding: 12px;
      border-radius: 8px;
      margin-top: 12px;
      display: none;
      word-break: break-all;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>闲鱼库存扫码</h1>


  <!-- =====================================
       当前操作
       ===================================== -->

  <div class="card">

    <div class="step">
      操作：入库
    </div>

    <div class="label">
      商品序号
    </div>

    <div
      id="serialDisplay"
      class="value">
      等待扫描
    </div>

    <div class="label" style="margin-top:15px;">
      仓存位置
    </div>

    <div
      id="locationDisplay"
      class="value">
      等待扫描
    </div>

  </div>


  <!-- =====================================
       扫描区域
       ===================================== -->

  <div class="card">

    <div
      id="stepTitle"
      class="step">
      第一步：扫描商品条码
    </div>

    <div
      id="reader">
    </div>

    <div
      id="scanStatus"
      class="scan-status">
      正在准备摄像头……
    </div>


    <!-- 扫描结果确认区域 -->

    <div
      id="scanConfirmArea"
      class="scan-result hidden">

      <div class="scan-result-title">
        扫描结果
      </div>

      <div
        id="scanResultValue"
        class="scan-result-value">
      </div>

      <button
        id="confirmScanButton"
        class="confirm"
        onclick="confirmScan()">
        确认
      </button>

      <button
        class="secondary"
        onclick="retryScan()">
        重新扫描
      </button>

    </div>

  </div>


  <!-- =====================================
       数量和操作
       ===================================== -->

  <div class="card">

    <div class="label">
      入库数量
    </div>

    <input
      id="quantityInput"
      type="number"
      min="1"
      step="1"
      placeholder="请输入数量">


    <button
      class="primary"
      onclick="executeStockIn()">
      执行入库
    </button>


    <button
      class="secondary"
      onclick="resetAll()">
      重新开始
    </button>


    <button
      class="secondary"
      onclick="testConnection()">
      测试连接
    </button>


    <div
      id="successMessage"
      class="success">
    </div>

    <div
      id="errorMessage"
      class="error">
    </div>

  </div>

</div>


<script>

  // ============================================
  // Apps Script Web App 地址
  // ============================================

  const APPS_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbykJPjh3aCJrypFpdMa_SmKA6fw2hbfZu-K5V1BRk0dZHEL6hPm_X6ICibQPnPUMvF-/exec";


  // ============================================
  // 扫描器
  // ============================================

  let scanner = null;


  // ============================================
  // 当前流程
  //
  // serial_scan
  //    ↓
  // serial_confirm
  //    ↓
  // location_scan
  //    ↓
  // location_confirm
  //    ↓
  // ready
  // ============================================

  let currentStep = "serial_scan";


  let pendingScanResult = "";


  let serial = "";

  let location = "";


  // ============================================
  // 页面加载
  // ============================================

  window.addEventListener("load", function() {

    startScanner();

  });


  // ============================================
  // 启动摄像头
  // ============================================

  function startScanner() {

    scanner =
      new Html5Qrcode("reader");


    const config = {

      fps: 10,

      qrbox: function(viewfinderWidth, viewfinderHeight) {

        return {
          width: Math.min(
            Math.floor(viewfinderWidth * 0.85),
            350
          ),

          height: Math.min(
            Math.floor(viewfinderHeight * 0.35),
            150
          )
        };

      },

      formatsToSupport: [

        Html5QrcodeSupportedFormats.CODE_128,

        Html5QrcodeSupportedFormats.CODE_39,

        Html5QrcodeSupportedFormats.EAN_13,

        Html5QrcodeSupportedFormats.EAN_8,

        Html5QrcodeSupportedFormats.UPC_A,

        Html5QrcodeSupportedFormats.UPC_E

      ]

    };


    scanner.start(

      {
        facingMode: "environment"
      },

      config,

      onScanSuccess,

      onScanFailure

    )

    .then(function() {

      updateScanStatus();

    })

    .catch(function(error) {

      document.getElementById("scanStatus").innerText =
        "无法启动摄像头：" + error;

    });

  }


  // ============================================
  // 扫描成功
  // ============================================

  function onScanSuccess(decodedText) {

    // 只在扫描状态下接受扫描结果
    if (
      currentStep !== "serial_scan" &&
      currentStep !== "location_scan"
    ) {

      return;

    }


    pendingScanResult =
      String(decodedText).trim();


    // 显示扫描结果
    document.getElementById(
      "scanResultValue"
    ).innerText =
      pendingScanResult;


    // 显示确认区域
    document.getElementById(
      "scanConfirmArea"
    ).classList.remove("hidden");


    // 根据当前步骤决定确认按钮文字
    if (
      currentStep === "serial_scan"
    ) {

      document.getElementById(
        "confirmScanButton"
      ).innerText =
        "确认商品序号";

    } else {

      document.getElementById(
        "confirmScanButton"
      ).innerText =
        "确认仓存位置";

    }


    // 记录当前正在确认
    if (
      currentStep === "serial_scan"
    ) {

      currentStep =
        "serial_confirm";

    } else {

      currentStep =
        "location_confirm";

    }


    // 暂停扫描
    pauseScanner();


    updateScanStatus();

  }


  // ============================================
  // 确认扫描结果
  // ============================================

  function confirmScan() {

    // ------------------------------------------
    // 确认商品序号
    // ------------------------------------------

    if (
      currentStep === "serial_confirm"
    ) {

      serial =
        pendingScanResult;


      document.getElementById(
        "serialDisplay"
      ).innerText =
        serial;


      pendingScanResult = "";


      document.getElementById(
        "scanConfirmArea"
      ).classList.add("hidden");


      currentStep =
        "location_scan";


      updateScanStatus();


      resumeScanner();

      return;

    }


    // ------------------------------------------
    // 确认仓存位置
    // ------------------------------------------

    if (
      currentStep === "location_confirm"
    ) {

      location =
        pendingScanResult;


      document.getElementById(
        "locationDisplay"
      ).innerText =
        location;


      pendingScanResult = "";


      document.getElementById(
        "scanConfirmArea"
      ).classList.add("hidden");


      currentStep =
        "ready";


      updateScanStatus();


      // 到这里已经不需要继续扫描
      pauseScanner();

      return;

    }

  }


  // ============================================
  // 重新扫描
  // ============================================

  function retryScan() {

    pendingScanResult = "";


    document.getElementById(
      "scanConfirmArea"
    ).classList.add("hidden");


    if (
      currentStep === "serial_confirm"
    ) {

      currentStep =
        "serial_scan";

    }

    else if (
      currentStep === "location_confirm"
    ) {

      currentStep =
        "location_scan";

    }


    updateScanStatus();


    resumeScanner();

  }


  // ============================================
  // 扫描失败
  // ============================================

  function onScanFailure(error) {

    // html5-qrcode 会持续调用这里，
    // 正常情况下不显示错误。

  }


  // ============================================
  // 暂停扫描
  // ============================================

  function pauseScanner() {

    if (!scanner) {
      return;
    }

    try {

      scanner.pause(true);

    } catch (error) {

      // 已经暂停时忽略

    }

  }


  // ============================================
  // 恢复扫描
  // ============================================

  function resumeScanner() {

    if (!scanner) {
      return;
    }

    try {

      scanner.resume();

    } catch (error) {

      // 如果恢复失败，重新启动扫描器
      restartScanner();

    }

  }


  // ============================================
  // 重新启动扫描器
  // ============================================

  function restartScanner() {

    if (!scanner) {
      return;
    }

    scanner.stop()
      .then(function() {

        scanner.clear();

        startScanner();

      })
      .catch(function() {

        startScanner();

      });

  }


  // ============================================
  // 更新扫描提示
  // ============================================

  function updateScanStatus() {

    const status =
      document.getElementById(
        "scanStatus"
      );


    const title =
      document.getElementById(
        "stepTitle"
      );


    if (
      currentStep === "serial_scan"
    ) {

      title.innerText =
        "第一步：扫描商品条码";

      status.innerText =
        "请扫描商品条码";

    }

    else if (
      currentStep === "serial_confirm"
    ) {

      title.innerText =
        "第一步：确认商品";

      status.innerText =
        "请确认扫描结果是否正确";

    }

    else if (
      currentStep === "location_scan"
    ) {

      title.innerText =
        "第二步：扫描仓存位置";

      status.innerText =
        "商品已确认，请扫描仓存位置条码";

    }

    else if (
      currentStep === "location_confirm"
    ) {

      title.innerText =
        "第二步：确认仓存位置";

      status.innerText =
        "请确认扫描结果是否正确";

    }

    else {

      title.innerText =
        "扫码完成";

      status.innerText =
        "商品和仓存位置已确认，请输入数量";

    }

  }


  // ============================================
  // 执行入库
  // ============================================

  async function executeStockIn() {

    hideMessages();


    // ------------------------------------------
    // 检查商品
    // ------------------------------------------

    if (!serial) {

      showError(
        "请先扫描并确认商品序号"
      );

      return;

    }


    // ------------------------------------------
    // 检查位置
    // ------------------------------------------

    if (!location) {

      showError(
        "请先扫描并确认仓存位置"
      );

      return;

    }


    // ------------------------------------------
    // 检查数量
    // ------------------------------------------

    const quantity =
      document.getElementById(
        "quantityInput"
      ).value.trim();


    if (!quantity) {

      showError(
        "请输入入库数量"
      );

      return;

    }


    if (
      Number(quantity) <= 0 ||
      !Number.isInteger(Number(quantity))
    ) {

      showError(
        "入库数量必须是大于 0 的整数"
      );

      return;

    }


    // ------------------------------------------
    // 防止重复点击
    // ------------------------------------------

    const button =
      document.querySelector(
        ".primary"
      );


    button.disabled = true;

    button.innerText =
      "正在执行入库……";


    try {

      const response =
        await fetch(
          APPS_SCRIPT_URL,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "text/plain;charset=utf-8"
            },

            body: JSON.stringify({

              action: "inventory",

              serial: serial,

              oldLocation: "",

              newLocation: location,

              quantity: Number(quantity),

              operationType: "入库"

            })

          }
        );


      const result =
        await response.json();


      if (result.success) {

        showSuccess(
          result.message ||
          "入库成功"
        );


        button.innerText =
          "入库成功";


      } else {

        showError(
          result.message ||
          "入库失败"
        );


        button.disabled = false;

        button.innerText =
          "执行入库";

      }

    }

    catch (error) {

      showError(
        "通信失败：" +
        error.message
      );


      button.disabled = false;

      button.innerText =
        "执行入库";

    }

  }


  // ============================================
  // 测试连接
  // ============================================

  async function testConnection() {

    hideMessages();


    try {

      const response =
        await fetch(
          APPS_SCRIPT_URL,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "text/plain;charset=utf-8"
            },

            body: JSON.stringify({

              action: "test"

            })

          }
        );


      const result =
        await response.json();


      if (result.success) {

        showSuccess(
          "✓ " + result.message
        );

      } else {

        showError(
          result.message ||
          "连接失败"
        );

      }

    }

    catch (error) {

      showError(
        "通信失败：" +
        error.message
      );

    }

  }


  // ============================================
  // 完全重新开始
  // ============================================

  function resetAll() {

    serial = "";

    location = "";

    pendingScanResult = "";

    currentStep =
      "serial_scan";


    document.getElementById(
      "serialDisplay"
    ).innerText =
      "等待扫描";


    document.getElementById(
      "locationDisplay"
    ).innerText =
      "等待扫描";


    document.getElementById(
      "quantityInput"
    ).value =
      "";


    document.getElementById(
      "scanConfirmArea"
    ).classList.add("hidden");


    const button =
      document.querySelector(
        ".primary"
      );


    button.disabled = false;

    button.innerText =
      "执行入库";


    hideMessages();


    updateScanStatus();


    resumeScanner();

  }


  // ============================================
  // 成功提示
  // ============================================

  function showSuccess(message) {

    const element =
      document.getElementById(
        "successMessage"
      );


    element.innerText =
      message;


    element.style.display =
      "block";

  }


  // ============================================
  // 错误提示
  // ============================================

  function showError(message) {

    const element =
      document.getElementById(
        "errorMessage"
      );


    element.innerText =
      "❌ " + message;


    element.style.display =
      "block";

  }


  // ============================================
  // 隐藏提示
  // ============================================

  function hideMessages() {

    document.getElementById(
      "successMessage"
    ).style.display =
      "none";


    document.getElementById(
      "errorMessage"
    ).style.display =
      "none";

  }

</script>

</body>
</html>
