<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>BYbuyerstore莫莫店</title>

<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 12px;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
      "Helvetica Neue", Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
  }

  .container {
    max-width: 520px;
    margin: 0 auto;
  }

  h1 {
    text-align: center;
    font-size: 24px;
    margin: 4px 0 12px;
  }

  .info-card {
    background: #fff;
    border-radius: 12px;
    padding: 18px 14px;
    margin-bottom: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }

  .operation-line {
    margin-bottom: 18px;
  }

  .operation-select {
    width: 100%;
    height: 40px;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 0 10px;
    font-size: 16px;
    background: #fff;
  }

  .info-row {
    display: flex;
    align-items: center;
    min-height: 40px;
    margin-bottom: 12px;
  }

  .info-row:last-child {
    margin-bottom: 0;
  }

  .info-label {
    width: 90px;
    flex-shrink: 0;
    color: #666;
    font-size: 15px;
  }

  .info-value {
    flex: 1;
    font-size: 18px;
    font-weight: 500;
    word-break: break-all;
  }

  .quantity-card {
    background: #fff;
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }

  .quantity-title {
    color: #666;
    font-size: 15px;
    margin-bottom: 7px;
  }

  .quantity-input {
    width: 100%;
    height: 44px;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 0 12px;
    font-size: 20px;
    text-align: center;
    outline: none;
  }

  .quantity-input:focus {
    border-color: #888;
  }

  .scan-card {
    background: #fff;
    border-radius: 12px;
    padding: 10px;
    margin-bottom: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }

  #reader {
    width: 100%;
    height: 260px;
    overflow: hidden;
    border-radius: 10px;
    background: #000;
  }

  #reader video {
    width: 100% !important;
    height: 260px !important;
    object-fit: cover !important;
  }

  .scan-status {
    text-align: center;
    font-size: 15px;
    color: #666;
    margin: 8px 0 4px;
    min-height: 20px;
  }

  .result-box {
    text-align: center;
    font-size: 18px;
    font-weight: 600;
    min-height: 26px;
    margin: 4px 0;
  }

  .button-row {
    display: flex;
    gap: 8px;
    margin-top: 8px;
  }

  button {
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
  }

  .confirm-button {
    flex: 1;
    height: 42px;
    background: #222;
    color: #fff;
  }

  .rescan-button {
    flex: 1;
    height: 42px;
    background: #eee;
    color: #222;
  }

  .execute-button {
    width: 100%;
    height: 48px;
    background: #222;
    color: #fff;
    font-size: 17px;
    margin-bottom: 8px;
  }

  .reset-button {
    width: 100%;
    height: 40px;
    background: #eee;
    color: #333;
    margin-bottom: 8px;
  }

  .test-button {
    display: block;
    margin: 2px auto 0;
    padding: 4px 9px;
    height: 26px;
    font-size: 12px;
    background: #eee;
    color: #777;
    border-radius: 6px;
  }

  /* ==============================
     手动输入区域
     默认完全隐藏
     ============================== */

  .manual-area {
    display: none;
    margin-bottom: 10px;
  }

  .manual-area.show {
    display: block;
  }

  .manual-box {
    background: #fff;
    border-radius: 12px;
    padding: 12px 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }

  .manual-title {
    color: #666;
    font-size: 15px;
    margin-bottom: 7px;
  }

  .manual-row {
    display: flex;
    gap: 8px;
  }

  .manual-input {
    flex: 1;
    height: 44px;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 0 12px;
    font-size: 18px;
    outline: none;
  }

  .manual-input:focus {
    border-color: #888;
  }

  .manual-confirm {
    width: 82px;
    height: 44px;
    background: #222;
    color: #fff;
  }

  .manual-cancel {
    width: 64px;
    height: 44px;
    background: #eee;
    color: #333;
  }

  .manual-toggle-area {
    text-align: center;
    margin-top: 8px;
  }

  .manual-toggle {
    background: transparent;
    color: #777;
    font-size: 13px;
    padding: 3px 6px;
  }

  @media (max-height: 700px) {
    #reader {
      height: 240px;
    }

    #reader video {
      height: 240px !important;
    }
  }
</style>

</head>

<body>

<div class="container">

  <h1>BYbuyerstore莫莫店</h1>

  <!-- 第一板块 -->

  <div class="info-card">


<div class="operation-line">
  <select id="operationType" class="operation-select">
    <option value="入库">入库</option>
    <option value="移库">移库</option>
    <option value="出库">出库</option>
  </select>
</div>

<div class="info-row">
  <div class="info-label">商品序号</div>
  <div class="info-value" id="serialDisplay">-</div>
</div>

<div class="info-row">
  <div class="info-label">仓存位置</div>
  <div class="info-value" id="locationDisplay">-</div>
</div>

<div class="info-row">
  <div class="info-label">目前库存</div>
  <div class="info-value" id="stockDisplay">-</div>
</div>


  </div>

  <!--
    手动输入区域
    注意：
    1. 这里位于第一板块和“入库数量”之间
    2. 默认 display:none
    3. 点击“无法扫码？手动输入”后才显示
  -->

  <div id="manualArea" class="manual-area">


<div class="manual-box">

  <div class="manual-title" id="manualTitle">
    手动输入
  </div>

  <div class="manual-row">

    <input
      id="manualInput"
      class="manual-input"
      type="text"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
      spellcheck="false"
    >

    <button
      id="manualConfirmButton"
      class="manual-confirm"
      onclick="confirmManualInput()"
    >
      确认
    </button>

    <button
      class="manual-cancel"
      onclick="hideManualInput()"
    >
      取消
    </button>

  </div>

</div>


  </div>

  <!-- 入库数量 -->

  <div class="quantity-card">


<div class="quantity-title">
  入库数量
</div>

<input
  id="quantity"
  class="quantity-input"
  type="number"
  min="1"
  inputmode="numeric"
  placeholder="请输入数量"
>


  </div>

  <!-- 扫码区域 -->

  <div class="scan-card">


<div id="reader"></div>

<div id="scanStatus" class="scan-status">
  正在准备摄像头...
</div>

<div id="resultBox" class="result-box"></div>

<div class="button-row">

  <button
    id="confirmScanButton"
    class="confirm-button"
    onclick="confirmScan()"
    style="display:none;"
  >
    确认
  </button>

  <button
    id="rescanButton"
    class="rescan-button"
    onclick="rescan()"
    style="display:none;"
  >
    重新扫描
  </button>

</div>

<!-- 手动输入入口 -->
<div class="manual-toggle-area">
  <button
    id="manualToggleButton"
    class="manual-toggle"
    onclick="showManualInput()"
  >
    无法扫码？手动输入
  </button>
</div>


  </div>

<button
class="execute-button"
onclick="executeInventory()"

>


执行入库


  </button>

<button
class="reset-button"
onclick="resetAll()"

>


重新开始


  </button>

<button
class="test-button"
onclick="testConnection()"

>

```
测试连接
```

  </button>

</div>

<script>

const SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbykJPjh3aCJrypFpdMa_SmKA6fw2hbfZu-K5V1BRk0dZHEL6hPm_X6ICibQPnPUMvF-/exec";

let scanner = null;

let scanStep = "product";

let serial = "";
let stockLocation = "";

let pendingScanValue = "";

let audioContext = null;


/* ==============================
   声音
   ============================== */

function initAudio() {

  if (!audioContext) {

    try {

      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    } catch (e) {

      console.log(
        "AudioContext 不可用"
      );

    }

  }

}


function unlockAudio() {

  initAudio();

  if (
    audioContext &&
    audioContext.state === "suspended"
  ) {

    audioContext.resume();

  }

}


function createScanBeep() {

  if (!audioContext) {
    return;
  }

  const oscillator =
    audioContext.createOscillator();

  const gain =
    audioContext.createGain();

  oscillator.type = "sine";

  oscillator.frequency.value = 880;

  gain.gain.setValueAtTime(
    0.0001,
    audioContext.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    0.18,
    audioContext.currentTime + 0.01
  );

  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    audioContext.currentTime + 0.13
  );

  oscillator.connect(gain);

  gain.connect(
    audioContext.destination
  );

  oscillator.start();

  oscillator.stop(
    audioContext.currentTime + 0.13
  );

}


function playScanBeep() {

  try {

    initAudio();

    if (
      audioContext &&
      audioContext.state === "suspended"
    ) {

      audioContext.resume().then(
        createScanBeep
      );

    } else {

      createScanBeep();

    }

  } catch (e) {

    console.log(
      "提示音播放失败",
      e
    );

  }

}


document.addEventListener(
  "touchstart",
  unlockAudio,
  {
    once: true
  }
);

document.addEventListener(
  "click",
  unlockAudio,
  {
    once: true
  }
);


/* ==============================
   页面初始化
   ============================== */

window.onload = function() {

  initAudio();

  startScanner();

};


/* ==============================
   摄像头
   ============================== */

function startScanner() {

  scanner =
    new Html5Qrcode(
      "reader"
    );

  const config = {

    fps: 15,

    qrbox: function(
      viewfinderWidth,
      viewfinderHeight
    ) {

      return {

        width: Math.min(
          Math.floor(
            viewfinderWidth * 0.90
          ),
          400
        ),

        height: Math.min(
          Math.floor(
            viewfinderHeight * 0.55
          ),
          220
        )

      };

    },

    formatsToSupport: [

      Html5QrcodeSupportedFormats.CODE_128,

      Html5QrcodeSupportedFormats.CODE_39,

      Html5QrcodeSupportedFormats.EAN_13,

      Html5QrcodeSupportedFormats.EAN_8,

      Html5QrcodeSupportedFormats.UPC_A,

      Html5QrcodeSupportedFormats.UPC_E

    ]

  };


  scanner.start(

    {
      facingMode: "environment"
    },

    config,

    onScanSuccess,

    onScanFailure

  )
  .then(function() {

    document.getElementById(
      "scanStatus"
    ).textContent =
      "请扫描商品条码";

  })
  .catch(function(error) {

    document.getElementById(
      "scanStatus"
    ).textContent =
      "摄像头启动失败：" +
      error;

  });

}


/* ==============================
   扫码成功
   ============================== */

function onScanSuccess(
  decodedText
) {

  if (
    pendingScanValue !== ""
  ) {

    return;

  }

  pendingScanValue =
    String(decodedText).trim();

  playScanBeep();

  hideManualInput();

  document.getElementById(
    "resultBox"
  ).textContent =
    pendingScanValue;

  document.getElementById(
    "confirmScanButton"
  ).style.display =
    "block";

  document.getElementById(
    "rescanButton"
  ).style.display =
    "block";

  document.getElementById(
    "scanStatus"
  ).textContent =
    scanStep === "product"
      ? "确认商品序号"
      : "确认仓存位置";

}


/* ==============================
   扫码失败
   ============================== */

function onScanFailure(error) {
}


/* ==============================
   确认扫码
   ============================== */

function confirmScan() {

  if (
    !pendingScanValue
  ) {

    return;

  }

  if (
    scanStep === "product"
  ) {

    serial =
      pendingScanValue;

    document.getElementById(
      "serialDisplay"
    ).textContent =
      serial;

    pendingScanValue = "";

    document.getElementById(
      "resultBox"
    ).textContent =
      "";

    document.getElementById(
      "confirmScanButton"
    ).style.display =
      "none";

    document.getElementById(
      "rescanButton"
    ).style.display =
      "none";

    scanStep = "location";

    document.getElementById(
      "scanStatus"
    ).textContent =
      "请扫描仓存位置";

    return;

  }


  if (
    scanStep === "location"
  ) {

    stockLocation =
      pendingScanValue;

    document.getElementById(
      "locationDisplay"
    ).textContent =
      stockLocation;

    pendingScanValue = "";

    document.getElementById(
      "resultBox"
    ).textContent =
      "";

    document.getElementById(
      "confirmScanButton"
    ).style.display =
      "none";

    document.getElementById(
      "rescanButton"
    ).style.display =
      "none";

    scanStep = "ready";

    document.getElementById(
      "scanStatus"
    ).textContent =
      "商品和仓位已确认";

  }

}


/* ==============================
   重新扫描
   ============================== */

function rescan() {

  pendingScanValue = "";

  document.getElementById(
    "resultBox"
  ).textContent =
    "";

  document.getElementById(
    "confirmScanButton"
  ).style.display =
    "none";

  document.getElementById(
    "rescanButton"
  ).style.display =
    "none";

  document.getElementById(
    "scanStatus"
  ).textContent =
    scanStep === "product"
      ? "请重新扫描商品条码"
      : "请重新扫描仓存位置";

}


/* ==============================
   手动输入
   ============================== */

function showManualInput() {

  const manualArea =
    document.getElementById(
      "manualArea"
    );

  const manualToggleButton =
    document.getElementById(
      "manualToggleButton"
    );

  const manualInput =
    document.getElementById(
      "manualInput"
    );

  const manualTitle =
    document.getElementById(
      "manualTitle"
    );


  manualArea.classList.add(
    "show"
  );

  manualToggleButton.style.display =
    "none";


  if (
    scanStep === "product"
  ) {

    manualTitle.textContent =
      "手动输入商品序号";

    manualInput.placeholder =
      "请输入商品序号";

  } else {

    manualTitle.textContent =
      "手动输入仓存位置";

    manualInput.placeholder =
      "请输入仓存位置";

  }


  manualInput.value = "";

  setTimeout(function() {

    manualInput.focus();

  }, 100);

}


function hideManualInput() {

  const manualArea =
    document.getElementById(
      "manualArea"
    );

  const manualToggleButton =
    document.getElementById(
      "manualToggleButton"
    );

  const manualInput =
    document.getElementById(
      "manualInput"
    );


  manualArea.classList.remove(
    "show"
  );

  manualToggleButton.style.display =
    "inline-block";

  manualInput.value = "";

}


function confirmManualInput() {

  const manualInput =
    document.getElementById(
      "manualInput"
    );

  const value =
    manualInput.value.trim();


  if (!value) {

    alert(
      scanStep === "product"
        ? "请输入商品序号"
        : "请输入仓存位置"
    );

    manualInput.focus();

    return;

  }


  pendingScanValue =
    value;

  document.getElementById(
    "resultBox"
  ).textContent =
    pendingScanValue;

  document.getElementById(
    "confirmScanButton"
  ).style.display =
    "block";

  document.getElementById(
    "rescanButton"
  ).style.display =
    "block";


  document.getElementById(
    "scanStatus"
  ).textContent =
    scanStep === "product"
      ? "确认商品序号"
      : "确认仓存位置";


  hideManualInput();

}


/* ==============================
   执行库存操作
   ============================== */

function executeInventory() {

  const quantity =
    document.getElementById(
      "quantity"
    ).value.trim();

  const operationType =
    document.getElementById(
      "operationType"
    ).value;


  if (!serial) {

    alert(
      "请先确认商品序号"
    );

    return;

  }


  if (!stockLocation) {

    alert(
      "请先确认仓存位置"
    );

    return;

  }


  if (
    !quantity ||
    Number(quantity) <= 0
  ) {

    alert(
      "请输入正确的数量"
    );

    return;

  }


  const button =
    document.querySelector(
      ".execute-button"
    );

  button.disabled = true;

  button.textContent =
    "正在执行...";


  fetch(
    SCRIPT_URL,
    {

      method: "POST",

      headers: {
        "Content-Type":
          "text/plain;charset=utf-8"
      },

      body: JSON.stringify({

        action: "inventory",

        serial: serial,

        oldLocation:
          operationType === "移库"
            ? stockLocation
            : "",

        newLocation:
          operationType === "出库"
            ? ""
            : stockLocation,

        quantity:
          quantity,

        operationType:
          operationType

      })

    }
  )
  .then(function(response) {

    return response.json();

  })
  .then(function(data) {

    if (
      data.success
    ) {

      alert(
        data.message ||
        "库存操作成功"
      );

      resetAll();

    } else {

      alert(
        data.message ||
        "库存操作失败"
      );

    }

  })
  .catch(function(error) {

    alert(
      "连接失败：" +
      error
    );

  })
  .finally(function() {

    button.disabled = false;

    button.textContent =
      "执行入库";

  });

}


/* ==============================
   测试连接
   ============================== */

function testConnection() {

  fetch(
    SCRIPT_URL +
      "?callback=phoneTestCallback"
  )
  .then(function(response) {

    return response.text();

  })
  .then(function(text) {

    alert(
      "手机扫码前端与 Apps Script 通信成功"
    );

  })
  .catch(function(error) {

    alert(
      "连接失败：" +
      error
    );

  });

}


/* ==============================
   重置
   ============================== */

function resetAll() {

  serial = "";

  stockLocation = "";

  pendingScanValue = "";

  scanStep = "product";


  document.getElementById(
    "serialDisplay"
  ).textContent =
    "-";

  document.getElementById(
    "locationDisplay"
  ).textContent =
    "-";

  document.getElementById(
    "stockDisplay"
  ).textContent =
    "-";

  document.getElementById(
    "quantity"
  ).value =
    "";

  document.getElementById(
    "resultBox"
  ).textContent =
    "";

  document.getElementById(
    "scanStatus"
  ).textContent =
    "请扫描商品条码";

  document.getElementById(
    "confirmScanButton"
  ).style.display =
    "none";

  document.getElementById(
    "rescanButton"
  ).style.display =
    "none";

  hideManualInput();

}

</script>

</body>
</html>
