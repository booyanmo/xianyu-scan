<!DOCTYPE html>

<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>BYbuyerstore莫莫店</title>

<script
  src="https://unpkg.com/html5-qrcode"
  type="text/javascript">
</script>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  background: #f5f5f5;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    Arial,
    sans-serif;
  color: #222;
}

body {
  padding: 12px;
}

.container {
  max-width: 520px;
  margin: 0 auto;
}

/* 标题 */

.title {
  text-align: center;
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 12px;
}

/* 第一板块 */

.card {
  background: #fff;
  border-radius: 12px;
  padding: 18px 14px;
  margin-bottom: 12px;
  box-shadow:
    0 1px 4px rgba(0,0,0,0.06);
}

.operation-line {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
}

.operation-title {
  font-size: 18px;
  font-weight: 700;
}

.operation-tag {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 54px;
  height: 30px;
  padding: 0 10px;
  border-radius: 15px;
  background: #222;
  color: #fff;
  font-size: 14px;
}

.info-row {
  display: flex;
  align-items: center;
  min-height: 40px;
  margin-bottom: 12px;
}

.info-row:last-child {
  margin-bottom: 0;
}

.info-label {
  width: 55px;
  flex-shrink: 0;
  font-size: 15px;
  color: #666;
}

.info-value {
  flex: 1;
  font-size: 18px;
  font-weight: 600;
  word-break: break-all;
}

/* 手动输入框出现的位置 */

#manualBoxTarget {
  width: 100%;
}

/* 数量 */

.quantity-row {
  display: flex;
  align-items: center;
  background: #fff;
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 12px;
  box-shadow:
    0 1px 4px rgba(0,0,0,0.06);
}

.quantity-label {
  font-size: 16px;
  font-weight: 600;
  margin-right: 12px;
  white-space: nowrap;
}

#quantityInput {
  flex: 1;
  min-width: 0;
  height: 42px;
  border: 1px solid #ddd;
  border-radius: 8px;
  padding: 0 12px;
  font-size: 16px;
  background: #fff;
}

/* 摄像头板块 */

.scanner-card {
  background: #fff;
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 12px;
  box-shadow:
    0 1px 4px rgba(0,0,0,0.06);
}

.step {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 10px;
}

#reader {
  width: 100%;
  height: 260px;
  overflow: hidden;
  border-radius: 10px;
}

#reader video {
  width: 100% !important;
  height: 260px !important;
  object-fit: cover !important;
  border-radius: 10px;
}

.scan-status {
  text-align: center;
  color: #777;
  font-size: 14px;
  margin-top: 8px;
}

/* 扫描结果 */

.result-box {
  margin-top: 12px;
  padding: 14px;
  border-radius: 10px;
  background: #f7f7f7;
}

.result-label {
  font-size: 13px;
  color: #777;
  margin-bottom: 5px;
}

.result-value {
  font-size: 21px;
  font-weight: 700;
  margin-bottom: 12px;
  word-break: break-all;
}

/* 手动输入 */

.manual-area {
  margin-top: 12px;
}

.manual-toggle {
  width: 100%;
  height: 38px;
  border: 1px solid #ddd;
  border-radius: 8px;
  background: #fff;
  color: #555;
  font-size: 14px;
}

.manual-box {
  margin-top: 12px;
  padding: 14px;
  background: #f7f7f7;
  border-radius: 10px;
}

.manual-title {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 10px;
}

.manual-row {
  display: flex;
  gap: 8px;
}

.manual-input {
  flex: 1;
  min-width: 0;
  height: 42px;
  border: 1px solid #ddd;
  border-radius: 8px;
  padding: 0 10px;
  font-size: 16px;
  background: #fff;
}

.manual-confirm {
  width: 70px;
  height: 42px;
  border: 0;
  border-radius: 8px;
  background: #222;
  color: #fff;
  font-size: 14px;
}

.manual-cancel {
  width: 100%;
  height: 34px;
  margin-top: 8px;
  border: 0;
  background: transparent;
  color: #777;
  font-size: 13px;
}

/* 按钮 */

button {
  -webkit-tap-highlight-color: transparent;
}

.primary {
  width: 100%;
  height: 46px;
  border: 0;
  border-radius: 10px;
  background: #222;
  color: #fff;
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 10px;
}

.secondary {
  width: 100%;
  height: 42px;
  border: 1px solid #ddd;
  border-radius: 10px;
  background: #fff;
  color: #555;
  font-size: 15px;
  margin-bottom: 10px;
}

.small-button {
  display: block;
  margin: 4px auto 0;
  padding: 4px 10px;
  height: 28px;
  border: 1px solid #ddd;
  border-radius: 6px;
  background: #fff;
  color: #777;
  font-size: 12px;
}

.success {
  color: #198754;
  text-align: center;
  font-size: 15px;
  margin-top: 8px;
}

.error {
  color: #dc3545;
  text-align: center;
  font-size: 15px;
  margin-top: 8px;
}

.hidden {
  display: none !important;
}

/* 小屏幕 */

@media (max-height: 700px) {

  #reader {
    height: 240px;
  }

  #reader video {
    height: 240px !important;
  }

}

</style>

</head>

<body>

<div class="container">

  <div class="title">
    BYbuyerstore莫莫店
  </div>

  <!-- 第一板块 -->

  <div class="card">


<div class="operation-line">

  <div class="operation-title">
    库存操作
  </div>

  <div
    id="operationTag"
    class="operation-tag">
    入库
  </div>

</div>

<div class="info-row">

  <div class="info-label">
    商品
  </div>

  <div
    id="serialDisplay"
    class="info-value">
    等待扫描
  </div>

</div>

<div class="info-row">

  <div class="info-label">
    仓位
  </div>

  <div
    id="locationDisplay"
    class="info-value">
    等待扫描
  </div>

</div>


  </div>

  <!--
    手动输入框专用位置

    平时为空，不占页面空间。
    点击“无法扫码？手动输入”后，
    #manualBox 会被移动到这里。
  -->

  <div id="manualBoxTarget"></div>

  <!-- 入库数量 -->

  <div class="quantity-row">


<div class="quantity-label">
  入库数量
</div>

<input
  id="quantityInput"
  type="number"
  min="1"
  step="1"
  placeholder="请输入数量">


  </div>

  <!-- 摄像头板块 -->

  <div class="scanner-card">


<div
  id="stepTitle"
  class="step">
  第一步：扫描商品条码
</div>

<div id="reader"></div>

<div
  id="scanStatus"
  class="scan-status">
  正在准备摄像头……
</div>

<div
  id="resultBox"
  class="result-box hidden">

  <div class="result-label">
    扫描结果
  </div>

  <div
    id="resultValue"
    class="result-value">
  </div>

  <button
    id="confirmButton"
    class="primary"
    onclick="confirmScan()">
    确认
  </button>

  <button
    class="secondary"
    onclick="retryScan()">
    重新扫描
  </button>

</div>


<!--
  注意：
  这个按钮的位置保持在摄像头板块原来的位置。
  只有下面的 manualBox 会在点击后移动。
-->

<div class="manual-area">

  <button
    id="manualToggleButton"
    class="manual-toggle"
    onclick="showManualInput()">
    无法扫码？手动输入
  </button>

</div>


<!--
  这是手动输入框本体。

  初始放在这里，但隐藏。
  点击“无法扫码？手动输入”后，
  JavaScript 会把它移动到
  #manualBoxTarget。

  所以正常页面不会改变。
-->

<div
  id="manualBox"
  class="manual-box hidden">

  <div
    id="manualTitle"
    class="manual-title">
    手动输入商品序号
  </div>

  <div class="manual-row">

    <input
      id="manualInput"
      class="manual-input"
      type="text"
      autocomplete="off"
      autocapitalize="characters"
      spellcheck="false"
      placeholder="请输入商品序号">

    <button
      class="manual-confirm"
      onclick="confirmManualInput()">
      确认
    </button>

  </div>

  <button
    class="manual-cancel"
    onclick="hideManualInput()">
    取消手动输入
  </button>

</div>


  </div>

  <!-- 执行区域 -->

<button
 id="stockInButton"
 class="primary"
 onclick="executeStockIn()">
执行入库 </button>

<button
 class="secondary"
 onclick="resetAll()">
重新开始 </button>

  <div
    id="successMessage"
    class="success">
  </div>

  <div
    id="errorMessage"
    class="error">
  </div>

  <!-- 测试连接 -->

<button
 class="small-button"
 onclick="testConnection()">
测试连接 </button>

</div>

<script>

/* =====================================================
   Apps Script 地址
   ===================================================== */

const API_URL =
  "https://script.google.com/macros/s/AKfycbykJPjh3aCJrypFpdMa_SmKA6fw2hbfZu-K5V1BRk0dZHEL6hPm_X6ICibQPnPUMvF-/exec";


/* =====================================================
   全局变量
   ===================================================== */

let scanner = null;

let serial = "";

let stockLocation = "";

let quantity = "";

let scanStep = "product";

let lastScanResult = "";

let audioContext = null;


/* =====================================================
   手动输入框原始位置
   ===================================================== */

const manualBox =
  document.getElementById("manualBox");

const manualBoxTarget =
  document.getElementById("manualBoxTarget");

const manualArea =
  document.querySelector(".manual-area");

const manualToggleButton =
  document.getElementById("manualToggleButton");


/*
 * 保存手动输入框最初的位置。
 *
 * 以后取消手动输入时，
 * 会把 manualBox 放回这里。
 */

const originalManualParent =
  manualBox.parentNode;

const originalManualNextSibling =
  manualBox.nextSibling;


/* =====================================================
   页面加载
   ===================================================== */

window.addEventListener(
  "load",
  function() {

    unlockAudio();

    startScanner();

  }
);


/* =====================================================
   iPhone 音频解锁
   ===================================================== */

function initAudio() {

  if (!audioContext) {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if (AudioContext) {
      audioContext =
        new AudioContext();
    }

  }

}


function unlockAudio() {

  initAudio();

  if (
    audioContext &&
    audioContext.state === "suspended"
  ) {

    audioContext.resume().catch(
      function() {}
    );

  }

}


document.addEventListener(
  "touchstart",
  unlockAudio,
  { passive: true }
);

document.addEventListener(
  "click",
  unlockAudio,
  { passive: true }
);


/* =====================================================
   扫描提示音
   ===================================================== */

function createScanBeep() {

  if (!audioContext) {
    return;
  }

  const oscillator =
    audioContext.createOscillator();

  const gainNode =
    audioContext.createGain();

  oscillator.type = "sine";

  oscillator.frequency.value = 880;

  gainNode.gain.setValueAtTime(
    0.0001,
    audioContext.currentTime
  );

  gainNode.gain.exponentialRampToValueAtTime(
    0.18,
    audioContext.currentTime + 0.01
  );

  gainNode.gain.exponentialRampToValueAtTime(
    0.0001,
    audioContext.currentTime + 0.13
  );

  oscillator.connect(gainNode);

  gainNode.connect(
    audioContext.destination
  );

  oscillator.start();

  oscillator.stop(
    audioContext.currentTime + 0.13
  );

}


function playScanBeep() {

  try {

    initAudio();

    if (!audioContext) {
      return;
    }

    if (
      audioContext.state ===
      "suspended"
    ) {

      audioContext.resume().then(
        function() {
          createScanBeep();
        }
      );

      return;
    }

    createScanBeep();

  } catch (error) {

    console.log(
      "提示音播放失败",
      error
    );

  }

}


/* =====================================================
   摄像头
   ===================================================== */

function startScanner() {

  const config = {

    fps: 15,

    qrbox:
      function(
        viewfinderWidth,
        viewfinderHeight
      ) {

        return {

          width:
            Math.min(
              Math.floor(
                viewfinderWidth * 0.90
              ),
              400
            ),

          height:
            Math.min(
              Math.floor(
                viewfinderHeight * 0.55
              ),
              220
            )

        };

      },

    formatsToSupport: [

      Html5QrcodeSupportedFormats.CODE_128,

      Html5QrcodeSupportedFormats.CODE_39,

      Html5QrcodeSupportedFormats.EAN_13,

      Html5QrcodeSupportedFormats.EAN_8,

      Html5QrcodeSupportedFormats.UPC_A,

      Html5QrcodeSupportedFormats.UPC_E

    ]

  };


  scanner =
    new Html5Qrcode("reader");


  scanner.start(

    {
      facingMode: "environment"
    },

    config,

    onScanSuccess,

    onScanFailure

  )
  .then(
    function() {

      document.getElementById(
        "scanStatus"
      ).textContent =
        "请将条码放入扫描框";

    }
  )
  .catch(
    function(error) {

      document.getElementById(
        "scanStatus"
      ).textContent =
        "摄像头启动失败，请检查浏览器权限";

      console.error(error);

    }
  );

}


/* =====================================================
   扫描成功
   ===================================================== */

function onScanSuccess(
  decodedText,
  decodedResult
) {

  if (
    lastScanResult === decodedText
  ) {
    return;
  }

  lastScanResult =
    decodedText;

  playScanBeep();

  document.getElementById(
    "resultValue"
  ).textContent =
    decodedText;

  document.getElementById(
    "resultBox"
  ).classList.remove("hidden");

  document.getElementById(
    "scanStatus"
  ).textContent =
    "已识别，请确认";

}


/* =====================================================
   扫描失败
   ===================================================== */

function onScanFailure(error) {

  // 正常扫描过程中会频繁触发，
  // 所以这里不显示错误。

}


/* =====================================================
   确认扫描
   ===================================================== */

function confirmScan() {

  const value =
    document.getElementById(
      "resultValue"
    ).textContent.trim();

  if (!value) {
    return;
  }


  document.getElementById(
    "resultBox"
  ).classList.add("hidden");


  if (
    scanStep === "product"
  ) {

    serial = value;

    document.getElementById(
      "serialDisplay"
    ).textContent =
      serial;


    scanStep = "location";


    document.getElementById(
      "stepTitle"
    ).textContent =
      "第二步：扫描仓位条码";


    document.getElementById(
      "scanStatus"
    ).textContent =
      "请扫描仓位";


    hideManualInput();

    return;

  }


  if (
    scanStep === "location"
  ) {

    stockLocation = value;

    document.getElementById(
      "locationDisplay"
    ).textContent =
      stockLocation;


    scanStep = "ready";


    document.getElementById(
      "stepTitle"
    ).textContent =
      "已完成商品和仓位确认";


    document.getElementById(
      "scanStatus"
    ).textContent =
      "请输入入库数量，然后执行入库";


    hideManualInput();

  }

}


/* =====================================================
   重新扫描
   ===================================================== */

function retryScan() {

  lastScanResult = "";

  document.getElementById(
    "resultBox"
  ).classList.add("hidden");

  document.getElementById(
    "resultValue"
  ).textContent = "";

  document.getElementById(
    "scanStatus"
  ).textContent =
    scanStep === "product"
      ? "请扫描商品条码"
      : "请扫描仓位条码";

}


/* =====================================================
   显示手动输入
   ===================================================== */

function showManualInput() {

  /*
   * 根据当前扫描步骤，
   * 设置标题和提示。
   */

  const title =
    document.getElementById(
      "manualTitle"
    );

  const input =
    document.getElementById(
      "manualInput"
    );


  if (
    scanStep === "product"
  ) {

    title.textContent =
      "手动输入商品序号";

    input.placeholder =
      "请输入商品序号";

  } else if (
    scanStep === "location"
  ) {

    title.textContent =
      "手动输入仓位";

    input.placeholder =
      "请输入仓位";

  } else {

    return;

  }


  /*
   * 核心修改：
   *
   * 不移动“无法扫码？手动输入”按钮。
   *
   * 只把真正的输入框 manualBox
   * 移动到第一板块和“入库数量”之间。
   */

  manualBoxTarget.appendChild(
    manualBox
  );


  manualBox.classList.remove(
    "hidden"
  );


  input.value = "";


  /*
   * 等页面完成移动以后再聚焦，
   * iPhone 会正常弹出键盘。
   */

  setTimeout(
    function() {

      input.focus();

    },
    100
  );

}


/* =====================================================
   隐藏手动输入
   ===================================================== */

function hideManualInput() {

  manualBox.classList.add(
    "hidden"
  );


  /*
   * 把输入框放回原来的位置。
   *
   * 这样“无法扫码？手动输入”按钮
   * 所在的摄像头板块完全恢复原状。
   */

  if (
    originalManualNextSibling &&
    originalManualNextSibling.parentNode ===
      originalManualParent
  ) {

    originalManualParent.insertBefore(
      manualBox,
      originalManualNextSibling
    );

  } else {

    originalManualParent.appendChild(
      manualBox
    );

  }


  document.getElementById(
    "manualInput"
  ).value = "";


  hideKeyboard();

}


/* =====================================================
   手动输入确认
   ===================================================== */

function confirmManualInput() {

  const input =
    document.getElementById(
      "manualInput"
    );

  const value =
    input.value.trim();


  if (!value) {

    input.focus();

    return;

  }


  if (
    scanStep === "product"
  ) {

    serial = value;


    document.getElementById(
      "serialDisplay"
    ).textContent =
      serial;


    scanStep = "location";


    document.getElementById(
      "stepTitle"
    ).textContent =
      "第二步：扫描仓位条码";


    document.getElementById(
      "scanStatus"
    ).textContent =
      "请扫描仓位";


    hideManualInput();


    return;

  }


  if (
    scanStep === "location"
  ) {

    stockLocation = value;


    document.getElementById(
      "locationDisplay"
    ).textContent =
      stockLocation;


    scanStep = "ready";


    document.getElementById(
      "stepTitle"
    ).textContent =
      "已完成商品和仓位确认";


    document.getElementById(
      "scanStatus"
    ).textContent =
      "请输入入库数量，然后执行入库";


    hideManualInput();

  }

}


/* =====================================================
   隐藏 iPhone 键盘
   ===================================================== */

function hideKeyboard() {

  const input =
    document.getElementById(
      "manualInput"
    );

  if (input) {
    input.blur();
  }

  const quantityInput =
    document.getElementById(
      "quantityInput"
    );

  if (
    document.activeElement ===
    quantityInput
  ) {
    quantityInput.blur();
  }

}


/* =====================================================
   执行入库
   ===================================================== */

async function executeStockIn() {

  const successMessage =
    document.getElementById(
      "successMessage"
    );

  const errorMessage =
    document.getElementById(
      "errorMessage"
    );

  successMessage.textContent = "";

  errorMessage.textContent = "";


  quantity =
    document.getElementById(
      "quantityInput"
    ).value.trim();


  if (!serial) {

    errorMessage.textContent =
      "请先扫描或手动输入商品序号";

    return;

  }


  if (!stockLocation) {

    errorMessage.textContent =
      "请先扫描或手动输入仓位";

    return;

  }


  if (
    !quantity ||
    Number(quantity) <= 0
  ) {

    errorMessage.textContent =
      "请输入正确的入库数量";

    return;

  }


  const button =
    document.getElementById(
      "stockInButton"
    );

  button.disabled = true;

  button.textContent =
    "正在入库……";


  try {

    const response =
      await fetch(
        API_URL,
        {

          method: "POST",

          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body: JSON.stringify({

            action: "inventory",

            serial: serial,

            oldLocation: "",

            newLocation:
              stockLocation,

            quantity:
              Number(quantity),

            operationType:
              "入库"

          })

        }
      );


    const result =
      await response.json();


    if (
      result &&
      result.success
    ) {

      successMessage.textContent =
        result.message ||
        "入库成功";

      errorMessage.textContent =
        "";


      document.getElementById(
        "scanStatus"
      ).textContent =
        "入库完成";


    } else {

      throw new Error(
        result &&
        result.message
          ? result.message
          : "库存操作失败"
      );

    }

  } catch (error) {

    errorMessage.textContent =
      error.message ||
      "入库失败";

  } finally {

    button.disabled = false;

    button.textContent =
      "执行入库";

  }

}

/* =====================================================
   测试 Apps Script 连接
   ===================================================== */

async function testConnection() {

  const successMessage =
    document.getElementById(
      "successMessage"
    );

  const errorMessage =
    document.getElementById(
      "errorMessage"
    );


  successMessage.textContent =
    "正在测试连接……";

  errorMessage.textContent = "";


  try {

    const response =
      await fetch(
        API_URL +
        "?callback=phoneTestCallback&_=" +
        Date.now()
      );


    const text =
      await response.text();


    if (
      text.indexOf(
        "手机扫码前端与 Apps Script 通信成功"
      ) !== -1 ||
      text.indexOf(
        "手机扫码前端连接成功"
      ) !== -1
    ) {

      successMessage.textContent =
        "✓ 手机扫码前端与 Apps Script 通信成功";

      return;

    }


    /*
     * 某些情况下 Apps Script
     * 返回的是 JSONP 内容。
     */

    if (
      text.indexOf(
        "phoneTestCallback"
      ) !== -1
    ) {

      successMessage.textContent =
        "✓ 手机扫码前端与 Apps Script 通信成功";

      return;

    }


    throw new Error(
      "连接返回内容异常"
    );

  } catch (error) {

    errorMessage.textContent =
      "连接失败：" +
      error.message;

  }

}
