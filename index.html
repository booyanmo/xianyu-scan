```html
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>闲鱼库存扫码</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: 10px;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin: 4px 0 10px;
      font-size: 22px;
    }

    .card {
      background: #fff;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .step {
      font-weight: 600;
      font-size: 16px;
      margin-bottom: 8px;
    }

    .label {
      font-size: 13px;
      color: #666;
      margin-bottom: 4px;
    }

    .value {
      font-size: 18px;
      font-weight: 600;
      min-height: 24px;
      word-break: break-all;
    }

    /*
     * 摄像头区域
     * 固定较矮的高度，避免页面被摄像头撑得太长
     */
    #reader {
      width: 100%;
      height: 280px;
      margin-top: 6px;
      overflow: hidden;
      border-radius: 8px;
    }

    /*
     * 让 html5-qrcode 的视频区域
     * 尽量填满 280px 高度
     */
    #reader video {
      width: 100% !important;
      height: 280px !important;
      object-fit: cover !important;
      border-radius: 8px;
    }

    #reader__dashboard {
      margin-top: 4px !important;
    }

    .scan-status {
      text-align: center;
      margin: 7px 0;
      color: #666;
      font-size: 13px;
    }

    .result-box {
      background: #f7f7f7;
      border-radius: 8px;
      padding: 10px;
      margin-top: 8px;
      text-align: center;
    }

    .result-label {
      font-size: 12px;
      color: #666;
      margin-bottom: 3px;
    }

    .result-value {
      font-size: 25px;
      font-weight: 700;
      word-break: break-all;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 11px;
      font-size: 17px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-top: 4px;
    }

    button {
      width: 100%;
      padding: 11px;
      margin-top: 7px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.55;
    }

    .primary {
      background: #222;
      color: #fff;
    }

    .secondary {
      background: #e8e8e8;
      color: #222;
    }

    .success {
      background: #e8f7e8;
      color: #176b17;
      padding: 10px;
      border-radius: 8px;
      margin-top: 8px;
      display: none;
      word-break: break-all;
    }

    .error {
      background: #fdeaea;
      color: #a00000;
      padding: 10px;
      border-radius: 8px;
      margin-top: 8px;
      display: none;
      word-break: break-all;
    }

    .hidden {
      display: none !important;
    }

    /*
     * 手机屏幕较矮时进一步压缩摄像头
     */
    @media (max-height: 700px) {
      body {
        padding: 7px;
      }

      h1 {
        margin: 2px 0 7px;
        font-size: 20px;
      }

      .card {
        padding: 10px;
        margin-bottom: 7px;
      }

      #reader {
        height: 240px;
      }

      #reader video {
        height: 240px !important;
      }

      .scan-status {
        margin: 5px 0;
      }

      button {
        padding: 9px;
        margin-top: 5px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>闲鱼库存扫码</h1>

  <!-- 当前操作 -->

  <div class="card">

    <div class="step">
      操作：入库
    </div>

    <div class="label">
      商品序号
    </div>

    <div
      id="serialDisplay"
      class="value">
      等待扫描
    </div>

    <div
      class="label"
      style="margin-top:10px;">
      仓存位置
    </div>

    <div
      id="locationDisplay"
      class="value">
      等待扫描
    </div>

  </div>


  <!-- 扫描区域 -->

  <div class="card">

    <div
      id="stepTitle"
      class="step">
      第一步：扫描商品条码
    </div>

    <div id="reader"></div>

    <div
      id="scanStatus"
      class="scan-status">
      正在准备摄像头……
    </div>


    <!-- 扫描结果确认 -->

    <div
      id="resultBox"
      class="result-box hidden">

      <div class="result-label">
        扫描结果
      </div>

      <div
        id="resultValue"
        class="result-value">
      </div>

      <button
        id="confirmButton"
        class="primary"
        onclick="confirmScan()">
        确认
      </button>

      <button
        class="secondary"
        onclick="retryScan()">
        重新扫描
      </button>

    </div>

  </div>


  <!-- 数量 -->

  <div class="card">

    <div class="label">
      入库数量
    </div>

    <input
      id="quantityInput"
      type="number"
      min="1"
      step="1"
      placeholder="请输入数量">

    <button
      id="stockInButton"
      class="primary"
      onclick="executeStockIn()">
      执行入库
    </button>

    <button
      class="secondary"
      onclick="resetAll()">
      重新开始
    </button>

    <button
      class="secondary"
      onclick="testConnection()">
      测试连接
    </button>

    <div
      id="successMessage"
      class="success">
    </div>

    <div
      id="errorMessage"
      class="error">
    </div>

  </div>

</div>


<script>

  // ==========================================
  // Apps Script
  // ==========================================

  const APPS_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbykJPjh3aCJrypFpdMa_SmKA6fw2hbfZu-K5V1BRk0dZHEL6hPm_X6ICibQPnPUMvF-/exec";


  // ==========================================
  // 扫描状态
  // ==========================================

  let scanner = null;

  let step = "serial";

  let pendingResult = "";

  let serial = "";

  // 注意：
  // 这里不能使用变量名 location，
  // 因为浏览器本身已经有 window.location。
  let stockLocation = "";


  // ==========================================
  // 页面加载
  // ==========================================

  window.addEventListener("load", function() {

    startScanner();

  });


  // ==========================================
  // 启动摄像头
  // ==========================================

  function startScanner() {

    scanner =
      new Html5Qrcode("reader");


    const config = {

      fps: 10,

      qrbox: function(
        viewfinderWidth,
        viewfinderHeight
      ) {

        return {

          width: Math.min(
            Math.floor(
              viewfinderWidth * 0.85
            ),
            350
          ),

          height: Math.min(
            Math.floor(
              viewfinderHeight * 0.35
            ),
            150
          )

        };

      },

      formatsToSupport: [

        Html5QrcodeSupportedFormats.CODE_128,

        Html5QrcodeSupportedFormats.CODE_39,

        Html5QrcodeSupportedFormats.EAN_13,

        Html5QrcodeSupportedFormats.EAN_8,

        Html5QrcodeSupportedFormats.UPC_A,

        Html5QrcodeSupportedFormats.UPC_E

      ]

    };


    scanner.start(

      {
        facingMode: "environment"
      },

      config,

      onScanSuccess,

      onScanFailure

    )

    .then(function() {

      updateStatus();

    })

    .catch(function(error) {

      document.getElementById(
        "scanStatus"
      ).innerText =
        "无法启动摄像头：" + error;

    });

  }


  // ==========================================
  // 扫描成功
  // ==========================================

  function onScanSuccess(decodedText) {

    if (
      step !== "serial" &&
      step !== "location"
    ) {

      return;

    }


    pendingResult =
      String(decodedText).trim();


    document.getElementById(
      "resultValue"
    ).innerText =
      pendingResult;


    document.getElementById(
      "resultBox"
    ).classList.remove("hidden");


    if (step === "serial") {

      document.getElementById(
        "confirmButton"
      ).innerText =
        "确认商品序号";

    } else {

      document.getElementById(
        "confirmButton"
      ).innerText =
        "确认仓存位置";

    }


    updateStatus();

  }


  // ==========================================
  // 确认扫描结果
  // ==========================================

  function confirmScan() {

    if (!pendingResult) {

      return;

    }


    // 商品确认

    if (step === "serial") {

      serial =
        pendingResult;


      document.getElementById(
        "serialDisplay"
      ).innerText =
        serial;


      pendingResult = "";


      document.getElementById(
        "resultBox"
      ).classList.add("hidden");


      step = "location";


      updateStatus();


      return;

    }


    // 位置确认

    if (step === "location") {

      stockLocation =
        pendingResult;


      document.getElementById(
        "locationDisplay"
      ).innerText =
        stockLocation;


      pendingResult = "";


      document.getElementById(
        "resultBox"
      ).classList.add("hidden");


      step = "ready";


      updateStatus();


      return;

    }

  }


  // ==========================================
  // 当前扫描结果不正确
  // ==========================================

  function retryScan() {

    pendingResult = "";


    document.getElementById(
      "resultBox"
    ).classList.add("hidden");


    updateStatus();

  }


  // ==========================================
  // 状态文字
  // ==========================================

  function updateStatus() {

    const title =
      document.getElementById(
        "stepTitle"
      );

    const status =
      document.getElementById(
        "scanStatus"
      );


    if (step === "serial") {

      title.innerText =
        "第一步：扫描商品条码";

      status.innerText =
        "请扫描商品条码";

    }

    else if (step === "location") {

      title.innerText =
        "第二步：扫描仓存位置";

      status.innerText =
        "商品序号已确认，请扫描仓存位置条码";

    }

    else {

      title.innerText =
        "扫码完成";

      status.innerText =
        "商品和仓存位置已确认，请输入数量";

    }

  }


  // ==========================================
  // 执行入库
  // ==========================================

  async function executeStockIn() {

    hideMessages();


    if (!serial) {

      showError(
        "请先扫描并确认商品序号"
      );

      return;

    }


    if (!stockLocation) {

      showError(
        "请先扫描并确认仓存位置"
      );

      return;

    }


    const quantity =
      document.getElementById(
        "quantityInput"
      ).value.trim();


    if (!quantity) {

      showError(
        "请输入入库数量"
      );

      return;

    }


    if (
      Number(quantity) <= 0 ||
      !Number.isInteger(
        Number(quantity)
      )
    ) {

      showError(
        "入库数量必须是大于 0 的整数"
      );

      return;

    }


    const button =
      document.getElementById(
        "stockInButton"
      );


    button.disabled = true;

    button.innerText =
      "正在执行入库……";


    try {

      const response =
        await fetch(
          APPS_SCRIPT_URL,
          {

            method: "POST",

            headers: {

              "Content-Type":
                "text/plain;charset=utf-8"

            },

            body: JSON.stringify({

              action: "inventory",

              serial: serial,

              oldLocation: "",

              newLocation: stockLocation,

              quantity: Number(quantity),

              operationType: "入库"

            })

          }
        );


      const result =
        await response.json();


      if (result.success) {

        showSuccess(
          result.message ||
          "入库成功"
        );


        button.innerText =
          "入库成功";


      } else {

        showError(
          result.message ||
          "入库失败"
        );


        button.disabled = false;

        button.innerText =
          "执行入库";

      }

    }

    catch (error) {

      showError(
        "通信失败：" +
        error.message
      );


      button.disabled = false;

      button.innerText =
        "执行入库";

    }

  }


  // ==========================================
  // 测试连接
  // ==========================================

  async function testConnection() {

    hideMessages();


    try {

      const response =
        await fetch(
          APPS_SCRIPT_URL,
          {

            method: "POST",

            headers: {

              "Content-Type":
                "text/plain;charset=utf-8"

            },

            body: JSON.stringify({

              action: "test"

            })

          }
        );


      const result =
        await response.json();


      if (result.success) {

        showSuccess(
          "✓ " + result.message
        );

      } else {

        showError(
          result.message ||
          "连接失败"
        );

      }

    }

    catch (error) {

      showError(
        "通信失败：" +
        error.message
      );

    }

  }


  // ==========================================
  // 完全重新开始
  // ==========================================

  function resetAll() {

    serial = "";

    stockLocation = "";

    pendingResult = "";

    step = "serial";


    document.getElementById(
      "serialDisplay"
    ).innerText =
      "等待扫描";


    document.getElementById(
      "locationDisplay"
    ).innerText =
      "等待扫描";


    document.getElementById(
      "quantityInput"
    ).value =
      "";


    document.getElementById(
      "resultBox"
    ).classList.add("hidden");


    const button =
      document.getElementById(
        "stockInButton"
      );


    button.disabled = false;

    button.innerText =
      "执行入库";


    hideMessages();


    updateStatus();

  }


  // ==========================================
  // 成功
  // ==========================================

  function showSuccess(message) {

    const element =
      document.getElementById(
        "successMessage"
      );


    element.innerText =
      message;


    element.style.display =
      "block";

  }


  // ==========================================
  // 错误
  // ==========================================

  function showError(message) {

    const element =
      document.getElementById(
        "errorMessage"
      );


    element.innerText =
      "❌ " + message;


    element.style.display =
      "block";

  }


  // ==========================================
  // 隐藏提示
  // ==========================================

  function hideMessages() {

    document.getElementById(
      "successMessage"
    ).style.display =
      "none";


    document.getElementById(
      "errorMessage"
    ).style.display =
      "none";

  }


  // ==========================================
  // 扫描失败
  // ==========================================

  function onScanFailure(error) {

    // 不显示连续扫描失败信息

  }

</script>

</body>
</html>
```
