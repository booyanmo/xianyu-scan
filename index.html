<html lang="zh-CN">
<head>

<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  background: #f5f5f5;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue",
               "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
  color: #222;
}

body {
  padding: 12px;
}

.container {
  max-width: 600px;
  margin: 0 auto;
}

/* =========================
   顶部标题
========================= */

.title {
  text-align: center;
  font-size: 24px;
  font-weight: 700;
  margin: 4px 0 14px;
}

/* =========================
   第一信息板块
========================= */

.info-card {
  background: #fff;
  border-radius: 12px;
  padding: 18px 14px;
  margin-bottom: 10px;
  box-shadow: 0 1px 5px rgba(0,0,0,0.08);
}

.operation-line {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
}

.operation-label {
  font-size: 16px;
  font-weight: 600;
}

.operation-select {
  height: 38px;
  padding: 0 12px;
  border: 1px solid #ddd;
  border-radius: 8px;
  background: #fff;
  font-size: 16px;
  outline: none;
}

.info-row {
  display: flex;
  align-items: center;
  min-height: 40px;
  margin-bottom: 12px;
}

.info-row:last-child {
  margin-bottom: 0;
}

.info-label {
  width: 82px;
  flex-shrink: 0;
  color: #666;
  font-size: 15px;
}

.info-value {
  flex: 1;
  min-width: 0;
  font-size: 18px;
  font-weight: 600;
  word-break: break-all;
}

/* =========================
   手动输入区域
   默认完全隐藏
========================= */

.manual-area {
  margin-bottom: 10px;
}

.manual-area.hidden {
  display: none;
}

.manual-box {
  background: #fff;
  border-radius: 12px;
  padding: 12px;
  box-shadow: 0 1px 5px rgba(0,0,0,0.08);
}

.manual-title {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 9px;
}

.manual-row {
  display: flex;
  gap: 8px;
}

.manual-input {
  flex: 1;
  min-width: 0;
  height: 42px;
  border: 1px solid #ccc;
  border-radius: 8px;
  padding: 0 11px;
  font-size: 17px;
  outline: none;
  background: #fff;
}

.manual-input:focus {
  border-color: #333;
}

.manual-confirm {
  flex-shrink: 0;
  height: 42px;
  padding: 0 15px;
  border: none;
  border-radius: 8px;
  background: #222;
  color: #fff;
  font-size: 15px;
}

.manual-cancel {
  margin-top: 8px;
  width: 100%;
  height: 34px;
  border: none;
  border-radius: 7px;
  background: #f0f0f0;
  color: #555;
  font-size: 14px;
}

/* =========================
   入库数量
========================= */

.quantity-card {
  background: #fff;
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 10px;
  box-shadow: 0 1px 5px rgba(0,0,0,0.08);
}

.quantity-label {
  font-size: 15px;
  color: #666;
  margin-bottom: 7px;
}

.quantity-input {
  width: 100%;
  height: 42px;
  border: 1px solid #ccc;
  border-radius: 8px;
  padding: 0 12px;
  font-size: 18px;
  outline: none;
}

.quantity-input:focus {
  border-color: #333;
}

/* =========================
   扫描区域
========================= */

.scan-card {
  background: #fff;
  border-radius: 12px;
  padding: 10px;
  margin-bottom: 10px;
  box-shadow: 0 1px 5px rgba(0,0,0,0.08);
}

#reader {
  width: 100%;
  height: 260px;
  overflow: hidden;
  border-radius: 10px;
  background: #111;
}

#reader video {
  width: 100% !important;
  height: 260px !important;
  object-fit: cover !important;
  border-radius: 10px;
}

.scan-status {
  text-align: center;
  font-size: 15px;
  color: #666;
  margin: 9px 0 5px;
  min-height: 20px;
}

.result-box {
  text-align: center;
  font-size: 18px;
  font-weight: 600;
  min-height: 26px;
  margin-bottom: 5px;
}

.manual-link-area {
  text-align: center;
  margin-top: 5px;
}

.manual-toggle {
  border: none;
  background: transparent;
  color: #666;
  font-size: 13px;
  padding: 5px 8px;
}

/* =========================
   按钮
========================= */

.button {
  width: 100%;
  height: 46px;
  border: none;
  border-radius: 9px;
  font-size: 17px;
  font-weight: 600;
}

.execute-button {
  background: #222;
  color: #fff;
  margin-bottom: 8px;
}

.reset-button {
  background: #e9e9e9;
  color: #333;
  margin-bottom: 8px;
}

.test-button {
  display: block;
  width: auto;
  height: 28px;
  padding: 0 10px;
  margin: 4px auto 0;
  border: none;
  border-radius: 6px;
  background: #e5e5e5;
  color: #666;
  font-size: 12px;
}

/* =========================
   小屏幕
========================= */

@media (max-height: 700px) {

  body {
    padding: 8px;
  }

  .title {
    font-size: 22px;
    margin-bottom: 9px;
  }

  .info-card {
    padding: 14px 12px;
    margin-bottom: 8px;
  }

  .operation-line {
    margin-bottom: 12px;
  }

  .info-row {
    min-height: 36px;
    margin-bottom: 8px;
  }

  .info-value {
    font-size: 17px;
  }

  .quantity-card {
    margin-bottom: 8px;
  }

  #reader {
    height: 240px;
  }

  #reader video {
    height: 240px !important;
  }

}

</style>

</head>

<script>

/* =========================================================
   Apps Script 地址
========================================================= */

const SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbykJPjh3aCJrypFpdMa_SmKA6fw2hbfZu-K5V1BRk0dZHEL6hPm_X6ICibQPnPUMvF-/exec";


/* =========================================================
   当前状态
========================================================= */

let scanner = null;

let serial = "";

let stockLocation = "";

let oldLocation = "";

let currentStock = "";

let scanStep = "product";

let isProcessing = false;


/* =========================================================
   音效
========================================================= */

let audioContext = null;


function initAudio() {

  if (!audioContext) {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if (AudioContext) {
      audioContext = new AudioContext();
    }

  }

}


function unlockAudio() {

  initAudio();

  if (
    audioContext &&
    audioContext.state === "suspended"
  ) {

    audioContext.resume();

  }

}


function createScanBeep() {

  if (!audioContext) {
    return;
  }

  const oscillator =
    audioContext.createOscillator();

  const gainNode =
    audioContext.createGain();

  oscillator.type = "sine";

  oscillator.frequency.value = 880;

  gainNode.gain.setValueAtTime(
    0.0001,
    audioContext.currentTime
  );

  gainNode.gain.exponentialRampToValueAtTime(
    0.18,
    audioContext.currentTime + 0.01
  );

  gainNode.gain.exponentialRampToValueAtTime(
    0.0001,
    audioContext.currentTime + 0.13
  );

  oscillator.connect(gainNode);

  gainNode.connect(audioContext.destination);

  oscillator.start();

  oscillator.stop(
    audioContext.currentTime + 0.13
  );

}


function playScanBeep() {

  try {

    initAudio();

    if (!audioContext) {
      return;
    }

    if (
      audioContext.state === "suspended"
    ) {

      audioContext
        .resume()
        .then(function() {

          createScanBeep();

        })
        .catch(function() {});

    } else {

      createScanBeep();

    }

  } catch (error) {}

}


document.addEventListener(
  "touchstart",
  unlockAudio,
  {
    once: false,
    passive: true
  }
);

document.addEventListener(
  "click",
  unlockAudio,
  {
    once: false
  }
);


/* =========================================================
   扫描器配置
========================================================= */

const config = {

  fps: 15,

  qrbox: function(
    viewfinderWidth,
    viewfinderHeight
  ) {

    return {

      width: Math.min(
        Math.floor(
          viewfinderWidth * 0.90
        ),
        400
      ),

      height: Math.min(
        Math.floor(
          viewfinderHeight * 0.55
        ),
        220
      )

    };

  },

  formatsToSupport: [

    Html5QrcodeSupportedFormats.CODE_128,

    Html5QrcodeSupportedFormats.CODE_39,

    Html5QrcodeSupportedFormats.EAN_13,

    Html5QrcodeSupportedFormats.EAN_8,

    Html5QrcodeSupportedFormats.UPC_A,

    Html5QrcodeSupportedFormats.UPC_E

  ]

};


/* =========================================================
   页面初始化
========================================================= */

window.addEventListener(
  "load",
  function() {

    initAudio();

    startScanner();

  }
);


/* =========================================================
   启动扫描器
========================================================= */

function startScanner() {

  const status =
    document.getElementById(
      "scanStatus"
    );

  status.textContent =
    "正在准备摄像头...";

  scanner =
    new Html5Qrcode("reader");

  scanner.start(

    {
      facingMode: "environment"
    },

    config,

    onScanSuccess,

    onScanFailure

  )
  .then(function() {

    status.textContent =
      "请扫描商品条码";

  })
  .catch(function(error) {

    console.error(error);

    status.textContent =
      "摄像头启动失败，请检查浏览器权限";

  });

}


/* =========================================================
   扫描成功
========================================================= */

function onScanSuccess(
  decodedText,
  decodedResult
) {

  if (isProcessing) {
    return;
  }

  if (!decodedText) {
    return;
  }

  playScanBeep();

  const text =
    String(decodedText).trim();

  /*
   防止同一个条码连续触发
  */

  isProcessing = true;

  if (scanStep === "product") {

    serial = text;

    document.getElementById(
      "serialDisplay"
    ).textContent = serial;

    document.getElementById(
      "resultBox"
    ).textContent =
      "确认商品序号：" + serial;

    document.getElementById(
      "scanStatus"
    ).textContent =
      "请确认商品序号";

    showConfirmButtons(
      "product"
    );

  }

  else if (scanStep === "oldLocation") {

    oldLocation = text;

    document.getElementById(
      "locationDisplay"
    ).textContent =
      oldLocation;

    document.getElementById(
      "resultBox"
    ).textContent =
      "确认原仓位：" + oldLocation;

    document.getElementById(
      "scanStatus"
    ).textContent =
      "请确认原仓位";

    showConfirmButtons(
      "oldLocation"
    );

  }

  else if (scanStep === "newLocation") {

    stockLocation = text;

    document.getElementById(
      "locationDisplay"
    ).textContent =
      stockLocation;

    document.getElementById(
      "resultBox"
    ).textContent =
      "确认新仓位：" + stockLocation;

    document.getElementById(
      "scanStatus"
    ).textContent =
      "请确认新仓位";

    showConfirmButtons(
      "newLocation"
    );

  }

}


/* =========================================================
   扫描失败
========================================================= */

function onScanFailure(error) {

  /*
   不显示连续失败信息，
   避免页面不断刷新文字。
  */

}


/* =========================================================
   确认按钮
========================================================= */

function showConfirmButtons(step) {

  const resultBox =
    document.getElementById(
      "resultBox"
    );

  if (
    document.getElementById(
      "confirmScanButton"
    )
  ) {

    return;

  }

  const confirmButton =
    document.createElement(
      "button"
    );

  confirmButton.id =
    "confirmScanButton";

  confirmButton.className =
    "button execute-button";

  confirmButton.style.marginTop =
    "8px";

  confirmButton.style.height =
    "40px";

  confirmButton.style.fontSize =
    "15px";

  confirmButton.textContent =
    "确认";

  confirmButton.onclick =
    function() {

      confirmScan(step);

    };


  const rescanButton =
    document.createElement(
      "button"
    );

  rescanButton.id =
    "rescanScanButton";

  rescanButton.className =
    "button reset-button";

  rescanButton.style.height =
    "40px";

  rescanButton.style.fontSize =
    "15px";

  rescanButton.style.marginTop =
    "6px";

  rescanButton.textContent =
    "重新扫描";

  rescanButton.onclick =
    function() {

      rescanCurrentStep();

    };


  resultBox.appendChild(
    confirmButton
  );

  resultBox.appendChild(
    rescanButton
  );

}


/* =========================================================
   确认扫描
========================================================= */

function confirmScan(step) {

  removeConfirmButtons();

  document.getElementById(
    "resultBox"
  ).textContent = "";

  isProcessing = false;

  if (step === "product") {

    scanStep =
      operationTypeValue() === "移库"
        ? "oldLocation"
        : "newLocation";

    if (
      scanStep === "oldLocation"
    ) {

      document.getElementById(
        "scanStatus"
      ).textContent =
        "请扫描原仓位";

    } else {

      document.getElementById(
        "scanStatus"
      ).textContent =
        "请扫描新仓位";

    }

  }

  else if (
    step === "oldLocation"
  ) {

    scanStep =
      "newLocation";

    document.getElementById(
      "scanStatus"
    ).textContent =
      "请扫描新仓位";

  }

  else if (
    step === "newLocation"
  ) {

    scanStep =
      "ready";

    document.getElementById(
      "scanStatus"
    ).textContent =
      "信息已确认，请输入数量并执行";

  }

}


/* =========================================================
   重新扫描当前步骤
========================================================= */

function rescanCurrentStep() {

  removeConfirmButtons();

  document.getElementById(
    "resultBox"
  ).textContent = "";

  isProcessing = false;

  if (scanStep === "product") {

    serial = "";

    document.getElementById(
      "serialDisplay"
    ).textContent =
      "等待扫描";

    document.getElementById(
      "scanStatus"
    ).textContent =
      "请重新扫描商品";

  }

  else if (
    scanStep === "oldLocation"
  ) {

    oldLocation = "";

    document.getElementById(
      "locationDisplay"
    ).textContent =
      "等待扫描";

    document.getElementById(
      "scanStatus"
    ).textContent =
      "请重新扫描原仓位";

  }

  else if (
    scanStep === "newLocation"
  ) {

    stockLocation = "";

    document.getElementById(
      "locationDisplay"
    ).textContent =
      "等待扫描";

    document.getElementById(
      "scanStatus"
    ).textContent =
      "请重新扫描新仓位";

  }

}


/* =========================================================
   删除确认按钮
========================================================= */

function removeConfirmButtons() {

  const confirmButton =
    document.getElementById(
      "confirmScanButton"
    );

  const rescanButton =
    document.getElementById(
      "rescanScanButton"
    );

  if (confirmButton) {
    confirmButton.remove();
  }

  if (rescanButton) {
    rescanButton.remove();
  }

}


/* =========================================================
   操作类型
========================================================= */

function operationTypeValue() {

  return document.getElementById(
    "operationType"
  ).value;

}


function operationChanged() {

  resetAll();

}


/* =========================================================
   手动输入
========================================================= */

function showManualInput() {

  const area =
    document.getElementById(
      "manualArea"
    );

  const toggle =
    document.getElementById(
      "manualToggleButton"
    );

  const input =
    document.getElementById(
      "manualInput"
    );

  const title =
    document.getElementById(
      "manualTitle"
    );


  area.classList.remove(
    "hidden"
  );

  toggle.style.display =
    "none";


  if (scanStep === "product") {

    title.textContent =
      "手动输入商品序号";

    input.placeholder =
      "请输入商品序号";

  }

  else if (
    scanStep === "oldLocation"
  ) {

    title.textContent =
      "手动输入原仓位";

    input.placeholder =
      "请输入原仓位";

  }

  else if (
    scanStep === "newLocation"
  ) {

    title.textContent =
      "手动输入新仓位";

    input.placeholder =
      "请输入新仓位";

  }

  else {

    title.textContent =
      "当前无需输入";

  }


  input.value = "";

  /*
   等页面完成布局后再聚焦。
   iPhone 会自动把输入框顶到键盘上方。
  */

  setTimeout(
    function() {

      input.focus();

    },
    120
  );

}


/* =========================================================
   隐藏手动输入
========================================================= */

function hideManualInput() {

  const area =
    document.getElementById(
      "manualArea"
    );

  const toggle =
    document.getElementById(
      "manualToggleButton"
    );

  const input =
    document.getElementById(
      "manualInput"
    );


  area.classList.add(
    "hidden"
  );

  toggle.style.display =
    "";

  input.value = "";

}


/* =========================================================
   手动输入回车
========================================================= */

function manualInputKeydown(event) {

  if (
    event.key === "Enter"
  ) {

    event.preventDefault();

    confirmManualInput();

  }

}


/* =========================================================
   确认手动输入
========================================================= */

function confirmManualInput() {

  const input =
    document.getElementById(
      "manualInput"
    );

  const value =
    String(
      input.value || ""
    ).trim();


  if (!value) {

    alert(
      "请输入内容"
    );

    input.focus();

    return;

  }


  if (scanStep === "product") {

    serial = value;

    document.getElementById(
      "serialDisplay"
    ).textContent =
      serial;

    document.getElementById(
      "resultBox"
    ).textContent =
      "已输入商品序号：" + serial;

    hideManualInput();

    /*
     手动输入同样需要进入确认状态，
     不直接跳过确认。
    */

    isProcessing = true;

    showConfirmButtons(
      "product"
    );

    document.getElementById(
      "scanStatus"
    ).textContent =
      "请确认商品序号";

  }

  else if (
    scanStep === "oldLocation"
  ) {

    oldLocation = value;

    document.getElementById(
      "locationDisplay"
    ).textContent =
      oldLocation;

    document.getElementById(
      "resultBox"
    ).textContent =
      "已输入原仓位：" + oldLocation;

    hideManualInput();

    isProcessing = true;

    showConfirmButtons(
      "oldLocation"
    );

    document.getElementById(
      "scanStatus"
    ).textContent =
      "请确认原仓位";

  }

  else if (
    scanStep === "newLocation"
  ) {

    stockLocation = value;

    document.getElementById(
      "locationDisplay"
    ).textContent =
      stockLocation;

    document.getElementById(
      "resultBox"
    ).textContent =
      "已输入新仓位：" + stockLocation;

    hideManualInput();

    isProcessing = true;

    showConfirmButtons(
      "newLocation"
    );

    document.getElementById(
      "scanStatus"
    ).textContent =
      "请确认新仓位";

  }


  hideKeyboard();

}


/* =========================================================
   收起 iPhone 键盘
========================================================= */

function hideKeyboard() {

  const input =
    document.getElementById(
      "manualInput"
    );

  input.blur();

}


/* =========================================================
   执行库存操作
========================================================= */

async function executeOperation() {

  if (isProcessing) {

    alert(
      "请先确认当前扫描结果"
    );

    return;

  }


  const operationType =
    operationTypeValue();


  const quantity =
    document.getElementById(
      "quantityInput"
    ).value.trim();


  if (!serial) {

    alert(
      "请先扫描或手动输入商品序号"
    );

    return;

  }


  if (
    operationType === "入库" &&
    !stockLocation
  ) {

    alert(
      "请先扫描或手动输入仓位"
    );

    return;

  }


  if (
    operationType === "移库" &&
    (
      !oldLocation ||
      !stockLocation
    )
  ) {

    alert(
      "请先确认原仓位和新仓位"
    );

    return;

  }


  if (
    operationType === "出库" &&
    !oldLocation &&
    !stockLocation
  ) {

    alert(
      "请先确认出库仓位"
    );

    return;

  }


  if (
    !quantity ||
    Number(quantity) <= 0
  ) {

    alert(
      "请输入正确的数量"
    );

    return;

  }


  const button =
    document.querySelector(
      ".execute-button"
    );

  button.disabled =
    true;

  button.textContent =
    "正在执行...";


  try {

    const response =
      await fetch(
        SCRIPT_URL,
        {

          method: "POST",

          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:
            JSON.stringify({

              action: "inventory",

              serial:
                serial,

              oldLocation:
                oldLocation,

              newLocation:
                stockLocation,

              quantity:
                Number(quantity),

              operationType:
                operationType

            })

        }
      );


    const result =
      await response.json();


    if (result.success) {

      alert(
        result.message ||
        "库存操作成功"
      );

      resetAll();

    }

    else {

      alert(
        result.message ||
        "库存操作失败"
      );

    }

  }

  catch (error) {

    console.error(error);

    alert(
      "连接服务器失败，请检查网络"
    );

  }

  finally {

    button.disabled =
      false;

    button.textContent =
      "执行操作";

  }

}


/* =========================================================
   测试连接
========================================================= */

function testConnection() {

  const callbackName =
    "phoneTestCallback_" +
    Date.now();

  window[
    callbackName
  ] = function(result) {

    alert(
      result &&
      result.message
        ? result.message
        : "连接成功"
    );

    try {

      delete window[
        callbackName
      ];

    } catch (error) {}

  };


  const script =
    document.createElement(
      "script"
    );

  script.src =
    SCRIPT_URL +
    "?callback=" +
    encodeURIComponent(
      callbackName
    );

  script.onerror =
    function() {

      alert(
        "连接失败，请检查网络或 Apps Script"
      );

      try {

        delete window[
          callbackName
        ];

      } catch (error) {}

    };


  document.body.appendChild(
    script
  );

}


/* =========================================================
   重新开始
========================================================= */

function resetAll() {

  serial = "";

  stockLocation = "";

  oldLocation = "";

  currentStock = "";

  scanStep = "product";

  isProcessing = false;


  removeConfirmButtons();

  hideManualInput();


  document.getElementById(
    "serialDisplay"
  ).textContent =
    "等待扫描";


  document.getElementById(
    "locationDisplay"
  ).textContent =
    "等待扫描";


  document.getElementById(
    "stockDisplay"
  ).textContent =
    "-";


  document.getElementById(
    "resultBox"
  ).textContent =
    "";


  document.getElementById(
    "scanStatus"
  ).textContent =
    "请扫描商品条码";


  document.getElementById(
    "quantityInput"
  ).value =
    "1";

}


/* =========================================================
   手动输入框文字更新
   保留接口，方便以后扩展
========================================================= */

function updateManualInputText() {

  const title =
    document.getElementById(
      "manualTitle"
    );

  if (scanStep === "product") {

    title.textContent =
      "手动输入商品序号";

  }

  else if (
    scanStep === "oldLocation"
  ) {

    title.textContent =
      "手动输入原仓位";

  }

  else if (
    scanStep === "newLocation"
  ) {

    title.textContent =
      "手动输入新仓位";

  }

}
