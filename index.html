<!DOCTYPE html>

<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BYbuyerstore莫莫店</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: 8px;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin: 3px 0 8px;
      font-size: 21px;
      font-weight: 700;
    }

    .info-card {
      background: #fff;
      border-radius: 10px;
      padding: 18px 14px;
      margin-bottom: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .operation-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .operation-title {
      font-size: 16px;
      font-weight: 600;
    }

    .operation-tag {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 12px;
      background: #f0f0f0;
      color: #555;
    }

    .info-row {
      display: flex;
      align-items: center;
      min-height: 40px;
      margin-bottom: 12px;
    }

    .info-row:last-child {
      margin-bottom: 0;
    }

    .info-label {
      width: 52px;
      flex-shrink: 0;
      font-size: 13px;
      color: #888;
    }

    .info-value {
      flex: 1;
      font-size: 18px;
      font-weight: 600;
      word-break: break-all;
    }

    .quantity-card {
      background: #fff;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .quantity-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .quantity-label {
      width: 64px;
      flex-shrink: 0;
      font-size: 13px;
      color: #666;
    }

    input {
      flex: 1;
      width: 100%;
      padding: 9px 10px;
      font-size: 17px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
      min-width: 0;
    }

    input:focus {
      border-color: #888;
    }

    .scan-card {
      background: #fff;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .step {
      font-weight: 600;
      font-size: 15px;
      margin-bottom: 6px;
    }

    #reader {
      width: 100%;
      height: 260px;
      margin-top: 4px;
      overflow: hidden;
      border-radius: 8px;
    }

    #reader video {
      width: 100% !important;
      height: 260px !important;
      object-fit: cover !important;
      border-radius: 8px;
    }

    #reader__dashboard {
      margin-top: 3px !important;
    }

    .scan-status {
      text-align: center;
      margin: 5px 0;
      color: #666;
      font-size: 12px;
    }

    .result-box {
      background: #f7f7f7;
      border-radius: 8px;
      padding: 8px;
      margin-top: 6px;
      text-align: center;
    }

    .result-label {
      font-size: 11px;
      color: #666;
      margin-bottom: 2px;
    }

    .result-value {
      font-size: 23px;
      font-weight: 700;
      word-break: break-all;
    }

    /* =========================
       手动输入
       ========================= */

    .manual-area {
      margin-top: 6px;
      text-align: center;
    }

    .manual-toggle {
      width: auto;
      display: inline-block;
      padding: 5px 9px;
      margin: 0;
      background: transparent;
      color: #777;
      font-size: 12px;
    }

    .manual-box {
      background: #f7f7f7;
      border-radius: 8px;
      padding: 9px;
      margin-top: 6px;
    }

    .manual-title {
      font-size: 12px;
      color: #666;
      margin-bottom: 6px;
    }

    .manual-row {
      display: flex;
      gap: 6px;
    }

    .manual-input {
      flex: 1;
      min-width: 0;
      padding: 8px 9px;
      font-size: 17px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
    }

    .manual-confirm {
      width: auto;
      flex-shrink: 0;
      padding: 8px 12px;
      margin: 0;
      background: #222;
      color: #fff;
      border-radius: 8px;
      font-size: 14px;
    }

    .manual-cancel {
      width: auto;
      padding: 4px 8px;
      margin: 5px 0 0;
      background: transparent;
      color: #888;
      font-size: 11px;
    }

    .action-card {
      background: #fff;
      border-radius: 10px;
      padding: 9px 10px;
      margin-bottom: 5px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    button {
      width: 100%;
      padding: 9px;
      margin-top: 5px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.55;
    }

    .primary {
      background: #222;
      color: #fff;
    }

    .secondary {
      background: #e8e8e8;
      color: #222;
    }

    .bottom-tools {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 2px;
      margin-bottom: 2px;
    }

    .small-button {
      width: auto;
      padding: 4px 8px;
      margin: 0;
      background: transparent;
      color: #888;
      font-size: 11px;
    }

    .small-button:active {
      background: #e8e8e8;
      border-radius: 5px;
    }

    .success {
      background: #e8f7e8;
      color: #176b17;
      padding: 8px;
      border-radius: 8px;
      margin-top: 6px;
      display: none;
      word-break: break-all;
      font-size: 13px;
    }

    .error {
      background: #fdeaea;
      color: #a00000;
      padding: 8px;
      border-radius: 8px;
      margin-top: 6px;
      display: none;
      word-break: break-all;
      font-size: 13px;
    }

    .hidden {
      display: none !important;
    }

    @media (max-height: 700px) {

      body {
        padding: 6px;
      }

      h1 {
        margin: 2px 0 6px;
        font-size: 20px;
      }

      .info-card {
        padding: 14px 11px;
        margin-bottom: 6px;
      }

      .operation-line {
        margin-bottom: 14px;
      }

      .info-row {
        min-height: 36px;
        margin-bottom: 9px;
      }

      .info-value {
        font-size: 17px;
      }

      .quantity-card {
        padding: 8px;
        margin-bottom: 6px;
      }

      .scan-card {
        padding: 8px;
        margin-bottom: 6px;
      }

      #reader {
        height: 240px;
      }

      #reader video {
        height: 240px !important;
      }

      .scan-status {
        margin: 4px 0;
      }

      .action-card {
        padding: 7px 8px;
      }

      button {
        padding: 8px;
        margin-top: 4px;
      }

    }

  </style>

</head>

<script>

  // ==========================================
  // Apps Script
  // ==========================================

  const APPS_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbykJPjh3aCJrypFpdMa_SmKA6fw2hbfZu-K5V1BRk0dZHEL6hPm_X6ICibQPnPUMvF-/exec";


  // ==========================================
  // 扫码提示音
  // ==========================================

  let audioContext = null;

  function initAudio() {

    if (!audioContext) {

      const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

      if (!AudioContext) {
        return;
      }

      audioContext =
        new AudioContext();

    }

    if (
      audioContext.state === "suspended"
    ) {

      audioContext.resume().catch(
        function() {}
      );

    }

  }


  function unlockAudio() {

    initAudio();

  }


  function playScanBeep() {

    try {

      initAudio();

      if (!audioContext) {
        return;
      }

      if (
        audioContext.state === "suspended"
      ) {

        audioContext.resume().then(
          function() {
            createScanBeep();
          }
        ).catch(
          function() {}
        );

        return;

      }

      createScanBeep();

    } catch (error) {

      // 声音失败不影响扫码功能

    }

  }


  function createScanBeep() {

    try {

      const oscillator =
        audioContext.createOscillator();

      const gainNode =
        audioContext.createGain();

      oscillator.type = "sine";

      oscillator.frequency.setValueAtTime(
        880,
        audioContext.currentTime
      );

      gainNode.gain.setValueAtTime(
        0.0001,
        audioContext.currentTime
      );

      gainNode.gain.exponentialRampToValueAtTime(
        0.18,
        audioContext.currentTime + 0.01
      );

      gainNode.gain.exponentialRampToValueAtTime(
        0.0001,
        audioContext.currentTime + 0.12
      );

      oscillator.connect(gainNode);

      gainNode.connect(
        audioContext.destination
      );

      oscillator.start();

      oscillator.stop(
        audioContext.currentTime + 0.13
      );

    } catch (error) {

      // 声音失败不影响扫码功能

    }

  }


  document.addEventListener(
    "touchstart",
    unlockAudio,
    {
      passive: true
    }
  );

  document.addEventListener(
    "click",
    unlockAudio,
    {
      passive: true
    }
  );


  // ==========================================
  // 扫描状态
  // ==========================================

  let scanner = null;

  let step = "serial";

  let pendingResult = "";

  let serial = "";

  let stockLocation = "";


  // ==========================================
  // 页面加载
  // ==========================================

  window.addEventListener(
    "load",
    function() {

      startScanner();

    }
  );


  // ==========================================
  // 启动摄像头
  // ==========================================

  function startScanner() {

    scanner =
      new Html5Qrcode("reader");


    const config = {

      fps: 15,

      qrbox: function(
        viewfinderWidth,
        viewfinderHeight
      ) {

        return {

          width: Math.min(
            Math.floor(
              viewfinderWidth * 0.90
            ),
            400
          ),

          height: Math.min(
            Math.floor(
              viewfinderHeight * 0.55
            ),
            220
          )

        };

      },

      formatsToSupport: [

        Html5QrcodeSupportedFormats.CODE_128,

        Html5QrcodeSupportedFormats.CODE_39,

        Html5QrcodeSupportedFormats.EAN_13,

        Html5QrcodeSupportedFormats.EAN_8,

        Html5QrcodeSupportedFormats.UPC_A,

        Html5QrcodeSupportedFormats.UPC_E

      ]

    };


    scanner.start(

      {
        facingMode: "environment"
      },

      config,

      onScanSuccess,

      onScanFailure

    )

    .then(function() {

      updateStatus();

    })

    .catch(function(error) {

      document.getElementById(
        "scanStatus"
      ).innerText =
        "无法启动摄像头：" + error;

    });

  }


  // ==========================================
  // 扫描成功
  // ==========================================

  function onScanSuccess(decodedText) {

    if (
      step !== "serial" &&
      step !== "location"
    ) {

      return;

    }


    playScanBeep();


    pendingResult =
      String(decodedText).trim();


    document.getElementById(
      "resultValue"
    ).innerText =
      pendingResult;


    document.getElementById(
      "resultBox"
    ).classList.remove("hidden");


    // 如果之前打开了手动输入，
    // 扫码成功后自动关闭
    hideManualInput();


    if (step === "serial") {

      document.getElementById(
        "confirmButton"
      ).innerText =
        "确认商品序号";

    } else {

      document.getElementById(
        "confirmButton"
      ).innerText =
        "确认仓存位置";

    }


    updateStatus();

  }


  // ==========================================
  // 确认扫描结果
  // ==========================================

  function confirmScan() {

    if (!pendingResult) {

      return;

    }


    if (step === "serial") {

      serial =
        pendingResult;


      document.getElementById(
        "serialDisplay"
      ).innerText =
        serial;


      pendingResult = "";


      document.getElementById(
        "resultBox"
      ).classList.add("hidden");


      step = "location";


      updateManualInputText();

      updateStatus();


      return;

    }


    if (step === "location") {

      stockLocation =
        pendingResult;


      document.getElementById(
        "locationDisplay"
      ).innerText =
        stockLocation;


      pendingResult = "";


      document.getElementById(
        "resultBox"
      ).classList.add("hidden");


      step = "ready";


      updateManualInputText();

      updateStatus();


      return;

    }

  }


  // ==========================================
  // 当前扫描结果不正确
  // ==========================================

  function retryScan() {

    pendingResult = "";


    document.getElementById(
      "resultBox"
    ).classList.add("hidden");


    updateStatus();

  }


  // ==========================================
  // 显示手动输入
  // ==========================================

  function showManualInput() {

    if (
      step !== "serial" &&
      step !== "location"
    ) {

      return;

    }


    document.getElementById(
      "manualBox"
    ).classList.remove("hidden");


    document.getElementById(
      "manualToggleButton"
    ).classList.add("hidden");


    updateManualInputText();


    const input =
      document.getElementById(
        "manualInput"
      );


    input.value = "";


    // 稍微延迟一下，
    // 确保 iPhone 键盘正常弹出
    setTimeout(
      function() {

        input.focus();

      },
      100
    );

  }


  // ==========================================
  // 隐藏手动输入
  // ==========================================

  function hideManualInput() {

    document.getElementById(
      "manualBox"
    ).classList.add("hidden");


    document.getElementById(
      "manualToggleButton"
    ).classList.remove("hidden");

  }


  // ==========================================
  // 更新手动输入文字
  // ==========================================

  function updateManualInputText() {

    const title =
      document.getElementById(
        "manualTitle"
      );

    const input =
      document.getElementById(
        "manualInput"
      );


    if (step === "serial") {

      title.innerText =
        "手动输入商品序号";

      input.placeholder =
        "请输入商品序号";

    }

    else if (step === "location") {

      title.innerText =
        "手动输入仓存位置";

      input.placeholder =
        "请输入仓存位置";

    }

    else {

      title.innerText =
        "";

      input.placeholder =
        "";

    }

  }


  // ==========================================
  // 确认手动输入
  // ==========================================

  function confirmManualInput() {

    const input =
      document.getElementById(
        "manualInput"
      );

    const value =
      input.value.trim();


    if (!value) {

      input.focus();

      return;

    }


    pendingResult = value;


    if (step === "serial") {

      serial =
        pendingResult;


      document.getElementById(
        "serialDisplay"
      ).innerText =
        serial;


      pendingResult = "";


      step = "location";


      hideManualInput();

      hideKeyboard();

      updateManualInputText();

      updateStatus();


      return;

    }


    if (step === "location") {

      stockLocation =
        pendingResult;


      document.getElementById(
        "locationDisplay"
      ).innerText =
        stockLocation;


      pendingResult = "";


      step = "ready";


      hideManualInput();

      hideKeyboard();

      updateManualInputText();

      updateStatus();


      return;

    }

  }


  // ==========================================
  // 收起 iPhone 键盘
  // ==========================================

  function hideKeyboard() {

    const input =
      document.getElementById(
        "manualInput"
      );


    input.blur();

  }


  // ==========================================
  // 状态文字
  // ==========================================

  function updateStatus() {

    const title =
      document.getElementById(
        "stepTitle"
      );

    const status =
      document.getElementById(
        "scanStatus"
      );


    if (step === "serial") {

      title.innerText =
        "第一步：扫描商品条码";

      status.innerText =
        "请扫描商品条码";

    }

    else if (step === "location") {

      title.innerText =
        "第二步：扫描仓存位置";

      status.innerText =
        "商品序号已确认，请扫描仓存位置条码";

    }

    else {

      title.innerText =
        "扫码完成";

      status.innerText =
        "商品和仓存位置已确认，请输入数量";

    }

  }


  // ==========================================
  // 执行入库
  // ==========================================

  async function executeStockIn() {

    hideMessages();


    if (!serial) {

      showError(
        "请先扫描并确认商品序号"
      );

      return;

    }


    if (!stockLocation) {

      showError(
        "请先扫描并确认仓存位置"
      );

      return;

    }


    const quantity =
      document.getElementById(
        "quantityInput"
      ).value.trim();


    if (!quantity) {

      showError(
        "请输入入库数量"
      );

      return;

    }


    if (
      Number(quantity) <= 0 ||
      !Number.isInteger(
        Number(quantity)
      )
    ) {

      showError(
        "入库数量必须是大于 0 的整数"
      );

      return;

    }


    const button =
      document.getElementById(
        "stockInButton"
      );


    button.disabled = true;

    button.innerText =
      "正在执行入库……";


    try {

      const response =
        await fetch(
          APPS_SCRIPT_URL,
          {

            method: "POST",

            headers: {

              "Content-Type":
                "text/plain;charset=utf-8"

            },

            body: JSON.stringify({

              action: "inventory",

              serial: serial,

              oldLocation: "",

              newLocation: stockLocation,

              quantity: Number(quantity),

              operationType: "入库"

            })

          }
        );


      const result =
        await response.json();


      if (result.success) {

        showSuccess(
          result.message ||
          "入库成功"
        );


        button.innerText =
          "入库成功";


      } else {

        showError(
          result.message ||
          "入库失败"
        );


        button.disabled = false;

        button.innerText =
          "执行入库";

      }

    }

    catch (error) {

      showError(
        "通信失败：" +
        error.message
      );


      button.disabled = false;

      button.innerText =
        "执行入库";

    }

  }


  // ==========================================
  // 测试连接
  // ==========================================

  async function testConnection() {

    hideMessages();


    try {

      const response =
        await fetch(
          APPS_SCRIPT_URL,
          {

            method: "POST",

            headers: {

              "Content-Type":
                "text/plain;charset=utf-8"

            },

            body: JSON.stringify({

              action: "test"

            })

          }
        );


      const result =
        await response.json();


      if (result.success) {

        showSuccess(
          "✓ " + result.message
        );

      } else {

        showError(
          result.message ||
          "连接失败"
        );

      }

    }

    catch (error) {

      showError(
        "通信失败：" +
        error.message
      );

    }

  }


  // ==========================================
  // 完全重新开始
  // ==========================================

  function resetAll() {

    serial = "";

    stockLocation = "";

    pendingResult = "";

    step = "serial";


    document.getElementById(
      "serialDisplay"
    ).innerText =
      "等待扫描";


    document.getElementById(
      "locationDisplay"
    ).innerText =
      "等待扫描";


    document.getElementById(
      "quantityInput"
    ).value =
      "";


    document.getElementById(
      "resultBox"
    ).classList.add("hidden");


    document.getElementById(
      "manualInput"
    ).value =
      "";


    hideManualInput();


    const button =
      document.getElementById(
        "stockInButton"
      );


    button.disabled = false;

    button.innerText =
      "执行入库";


    hideMessages();


    updateManualInputText();

    updateStatus();

  }


  // ==========================================
  // 成功
  // ==========================================

  function showSuccess(message) {

    const element =
      document.getElementById(
        "successMessage"
      );


    element.innerText =
      message;


    element.style.display =
      "block";

  }


  // ==========================================
  // 错误
  // ==========================================

  function showError(message) {

    const element =
      document.getElementById(
        "errorMessage"
      );


    element.innerText =
      "❌ " + message;


    element.style.display =
      "block";

  }


  // ==========================================
  // 隐藏提示
  // ==========================================

  function hideMessages() {

    document.getElementById(
      "successMessage"
    ).style.display =
      "none";


    document.getElementById(
      "errorMessage"
    ).style.display =
      "none";

  }


  // ==========================================
  // 扫描失败
  // ==========================================

  function onScanFailure(error) {

    // 不显示连续扫描失败信息

  }

</script>

</body>
</html>
